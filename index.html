<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timesheet</title>
<script>try{var _t=localStorage.getItem("theme");if(_t)document.documentElement.dataset.theme=_t}catch(e){}</script>
<meta name="theme-color" content="#2563eb">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f7fd;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#dbe4f0;--ac:#2563eb;--acd:#1d4ed8;--acs:#eaf2ff;--free:#10b981;--head:#eef3fb;--sh:0 1px 2px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1a;--card:#0f1726;--tx:#e6e9f0;--mut:#8b95a7;--bd:#1f2a40;--ac:#5b9dff;--acd:#4a8af0;--acs:#16264a;--free:#22c08a;--head:#17223a;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0a0f1a;--card:#0f1726;--tx:#e6e9f0;--mut:#8b95a7;--bd:#1f2a40;--ac:#5b9dff;--acd:#4a8af0;--acs:#16264a;--free:#22c08a;--head:#17223a;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3)}
:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd)}
.top .in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;color:#fff;flex:none}
.brandname{font-size:18px;letter-spacing:-.2px}
#who{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
#who:empty{display:none}
.av{width:28px;height:28px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font:700 13px/1 inherit;font-style:normal}
main{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
input{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
button{padding:9px 15px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
button:hover{background:var(--head)}button:active{transform:translateY(1px)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.p:hover{background:var(--acd)}
button.on{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.seg{display:inline-flex;background:var(--head);padding:4px;border-radius:12px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.mut{color:var(--mut);font-size:13px}
.wrap{overflow:auto;max-height:68vh;border:1px solid var(--bd);border-radius:12px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:620px;user-select:none;touch-action:pan-x pan-y}
body.paintmode table{touch-action:none}
.pmbtn{display:none}
@media (pointer:coarse){.pmbtn{display:inline-block}.wrap{max-height:none}}
th,td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);text-align:center;padding:0;height:27px;font-size:11px}
th{background:var(--head);font-size:12px;font-weight:600;padding:6px 4px}
tr:first-child th{position:sticky;top:0;z-index:2}
th.t{width:56px;color:var(--mut);position:sticky;left:0;z-index:1;font-weight:500}
tr:first-child th.t{z-index:3}
tr:nth-child(6n+2) td,tr:nth-child(6n+2) th.t{border-top:2px solid var(--bd)}
td.c{cursor:pointer;max-width:90px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
td.c:hover{background:var(--acs)}
td.busy,td.busy:hover{background:var(--ac);color:#fff}
td.sel{outline:3px solid #f59e0b;outline-offset:-3px}
td.free,td.free:hover{background:var(--free);color:#fff;font-weight:700}
td.part,td.part:hover{background:var(--head);color:var(--mut);font-weight:600}
.nav{margin-bottom:12px}.nav input{padding:7px 10px}.nav b{font-size:14px;margin-left:4px}
th.today{color:var(--ac)}th.selday{background:var(--acs)}th small{font-weight:500;color:var(--mut);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:0 0 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.chip{display:inline-block;background:var(--head);border-radius:99px;padding:3px 12px;font-size:13px;margin:3px 3px 0 0}
.chip.ok{background:color-mix(in srgb,var(--free) 18%,transparent);color:var(--free);font-weight:600}
.teams button{margin:0 6px 6px 0}
.code{font:700 17px ui-monospace,Consolas,monospace;letter-spacing:3px;background:var(--acs);color:var(--ac);padding:3px 12px;border-radius:10px}
details summary{cursor:pointer;font-weight:600}details ul{margin:10px 0 0;padding-left:20px}details li{margin:4px 0}
#app:has(.auth){min-height:calc(100vh - 150px);display:flex;align-items:center;justify-content:center}
.auth{display:grid;grid-template-columns:1.1fr 1fr;width:100%;max-width:860px;margin:0 auto;border-radius:20px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bd)}
.brand{padding:36px 32px;background:linear-gradient(150deg,#2563eb,#1e40af);color:#fff}
.brand h2{font-size:26px;line-height:1.25;margin:18px 0 10px}.brand p{opacity:.85;margin:0 0 16px}
.brand ul{margin:0;padding:0;list-style:none}.brand li{margin:8px 0;padding-left:26px;position:relative;opacity:.95}
.brand li:before{content:"✓";position:absolute;left:0;font-weight:700}
.auth .form{border:0;border-radius:0;box-shadow:none;margin:0;padding:32px 28px;display:flex;flex-direction:column;justify-content:center}
.auth .form .col{display:flex;flex-direction:column;gap:10px}
.gbtn{display:flex;gap:10px;align-items:center;justify-content:center;padding:11px}
.gbtn b{font-size:17px;background:linear-gradient(90deg,#4285f4,#ea4335,#fbbc05,#34a853);-webkit-background-clip:text;background-clip:text;color:transparent}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}
#msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;box-shadow:var(--sh);font-size:14px;max-width:92vw;z-index:30}
#msg:empty{display:none}
@media (max-width:700px){.auth{grid-template-columns:1fr}.brand{padding:24px}.brand h2{font-size:21px}.card{padding:14px}}

/* ===== Giao diện sau đăng nhập: toàn màn hình, nằm ngang ===== */
body:has(.shell) main{max-width:none}
body:has(.shell) .top .in{max-width:none}
.shell{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;align-items:center;gap:10px}
.split{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px}
.split>.card,.cards3>.card{margin:0}
.side{display:flex;flex-direction:column;gap:12px;padding:16px;min-height:0;overflow:auto}
.side h2{margin:0;font-size:18px}
.side button{width:100%}
.side .row button{width:auto}
.side .seg{display:flex}.side .seg button{flex:1;width:auto}
.pane{display:flex;flex-direction:column;min-height:0;padding:12px}
.ptop{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;margin-bottom:10px}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0}
.nav b{margin-left:6px;font-size:15px}
.legend{margin:0}
.wrap{position:relative;flex:1;height:72vh;min-height:420px;max-height:none}
.wrap table{position:absolute;left:0;top:0;width:100%;height:100%;min-height:520px;min-width:640px;table-layout:fixed}
td.c{max-width:none}
th.t{width:56px}
th,td{font-size:12px}
.free-list{flex:1;min-height:0;overflow:auto}
.free-list>div{padding:5px 0;border-bottom:1px dashed var(--bd)}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:40;padding:16px}
.modal[hidden]{display:none}
.modal .card{max-width:580px;max-height:90vh;overflow:auto;margin:0}
.modal ul{margin:10px 0 0;padding-left:20px}.modal li{margin:6px 0}
@media (min-width:901px) and (min-height:560px){
 body:has(.shell){height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
 body:has(.shell) main{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px}
 #app:has(.shell){flex:1;min-height:0;display:flex;flex-direction:column}
 .shell{flex:1;min-height:0}
 #body{flex:1;min-height:0}
 .split{height:100%}
 .wrap{height:auto}
}

/* ===== Ghi chú phong phú ===== */
.n1{--nc:#0d9488}td.busy.n1,td.busy.n1:hover{background:var(--nc);color:#fff}
.n2{--nc:#7c3aed}td.busy.n2,td.busy.n2:hover{background:var(--nc);color:#fff}
.n3{--nc:#e11d48}td.busy.n3,td.busy.n3:hover{background:var(--nc);color:#fff}
.n4{--nc:#d97706}td.busy.n4,td.busy.n4:hover{background:var(--nc);color:#fff}
.n5{--nc:#db2777}td.busy.n5,td.busy.n5:hover{background:var(--nc);color:#fff}
.n6{--nc:#15803d}td.busy.n6,td.busy.n6:hover{background:var(--nc);color:#fff}
.n7{--nc:#4f46e5}td.busy.n7,td.busy.n7:hover{background:var(--nc);color:#fff}

td.busy{font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none;margin-top:6px}

.nl{flex:1;min-height:90px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.ni{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;background:var(--bg)}

.side .nx{width:auto;padding:0 8px;border:0;background:transparent;color:var(--mut);font-size:18px;line-height:1.2}
.nbox{display:flex;flex-direction:column;gap:8px}
.qn{display:flex;gap:6px;flex-wrap:wrap}
.side .qb{width:auto;padding:3px 10px;font-size:12px;border-radius:99px;font-weight:500}
.side h3{margin:0;font-size:13px;color:var(--mut);font-weight:600}

.thm{padding:3px;flex:none}.thm button{padding:5px 10px;font-size:13px;display:inline-flex;gap:5px;align-items:center}

/* ===== Thành viên (cửa sổ riêng) ===== */
.modal .card{width:min(580px,100%)}
.mem-btn{display:flex;justify-content:space-between;align-items:center;gap:8px}

.bar{height:6px;border-radius:99px;background:var(--head);overflow:hidden;margin-top:-4px}.bar i{display:block;height:100%;background:var(--free);transition:width .3s}
.mlist{margin-top:10px;max-height:52vh;overflow:auto;display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--bd)}
.mrow .mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .chip{margin:0;flex:none}
.av{width:30px;height:30px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:700;flex:none}

/* ===== Bình chọn ===== */
.mem-btn.on{border-color:var(--ac);background:var(--acs);color:var(--ac)}
.polls{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;align-content:start;padding:2px}
.pcard{border:1px solid var(--bd);border-radius:14px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.pcard h3{margin:0;font-size:16px;overflow-wrap:anywhere}
.pmeta{font-size:12px;color:var(--mut)}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--head);color:var(--mut);white-space:nowrap;font-weight:600}
.tag.open{background:color-mix(in srgb,var(--free) 18%,transparent);color:var(--free)}
.popt{position:relative;display:block;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);overflow:hidden;cursor:pointer;font-weight:500}
.popt .fill{position:absolute;left:0;top:0;bottom:0;background:var(--acs);transition:width .3s}
.popt .in2{position:relative;display:flex;justify-content:space-between;gap:10px;align-items:center}
.popt .in2>span:first-child{overflow-wrap:anywhere}.popt .cnt{white-space:nowrap;color:var(--mut);font-size:12px}
.popt.on{border-color:var(--ac)}.popt.on .fill{background:color-mix(in srgb,var(--ac) 28%,transparent)}
.popt.lead .cnt{color:var(--tx);font-weight:700}
.pcard.closed .popt{cursor:default}
.pvoters{font-size:11px;color:var(--mut);margin:-3px 4px 2px}
.pa{width:auto;padding:4px 10px;font-size:12px}
#pcm .rm{width:auto;padding:4px 10px}
#po{display:flex;flex-direction:column;gap:8px;margin:10px 0}

/* ===== 3 cột: thao tác | lịch | ghi chú ===== */
.split3{grid-template-columns:290px minmax(0,1fr) 280px}
.notes h2{font-size:16px}
@media (max-width:1280px){.split3{grid-template-columns:250px minmax(0,1fr) 230px}}
@media (max-width:900px){.split3{grid-template-columns:1fr}.notes .nl{max-height:260px}}

/* ===== Cột phải: Chat + Ghi chú / Khung giờ rảnh ===== */
.split3{grid-template-columns:290px minmax(0,1fr) 320px}
@media (max-width:1280px){.split3{grid-template-columns:250px minmax(0,1fr) 270px}}
@media (max-width:900px){.split3{grid-template-columns:1fr}}
.rcol{display:flex;flex-direction:column;gap:14px;min-height:0}
.rcol>.card{flex:1 1 0;min-height:0;margin:0}
@media (max-width:900px){.rcol>.card{flex:none;height:360px}}
.chat,.notes{overflow:hidden}
.cl{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.cday{align-self:center;font-size:11px;color:var(--mut);background:var(--head);padding:2px 10px;border-radius:99px;margin:4px 0}
.cm{display:flex;flex-direction:column;max-width:88%;align-self:flex-start}
.cm.me{align-self:flex-end;align-items:flex-end}
.cm .ch{font-size:11px;color:var(--mut);margin:0 6px 2px}.cm .ch b{color:var(--tx);font-weight:600}
.cm .cb{background:var(--head);padding:7px 11px;border-radius:14px 14px 14px 4px;overflow-wrap:anywhere;white-space:pre-wrap;font-size:13.5px;line-height:1.4}

.side .cin{flex-wrap:nowrap}.side .cin button{width:auto}
</style>
</head>

<header class="top"><div class="in"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 14h3"/></svg></div><b class="brandname">Timesheet</b><span class="sp"></span><span id="who"></span><button id="out" hidden>Đăng xuất</button><div class="seg thm" role="group" aria-label="Giao diện"><button id="thl" title="Giao diện sáng">☀️<span>Sáng</span></button><button id="thd" title="Giao diện tối">🌙<span>Tối</span></button></div></div></header>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// >>> DÁN CẤU HÌNH SUPABASE CỦA BẠN (Project Settings → API) <<<
const SUPABASE_URL="https://bvsjikandybvzuzkxwpx.supabase.co";
const SUPABASE_KEY="sb_publishable_bLd1cdU4FoDY3DgJ_NhauA_SFTojuAR";

const DAYS=["Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7","CN"],H=[...Array(24).keys()];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say=t=>{$("msg").textContent=t||"";clearTimeout(say.t);if(t)say.t=setTimeout(()=>{$("msg").textContent=""},6000)};

/* ---------- giao diện sáng / tối ---------- */
const rootEl=document.documentElement,mq=matchMedia("(prefers-color-scheme:dark)");
const isDark=()=>rootEl.dataset.theme?rootEl.dataset.theme==="dark":mq.matches;
function paintTheme(){const d=isDark();$("thl").className=d?"":"on";$("thd").className=d?"on":"";
  $("thl").setAttribute("aria-pressed",!d);$("thd").setAttribute("aria-pressed",d);
  const mt=document.querySelector("meta[name=theme-color]");if(mt)mt.content=d?"#0f1726":"#2563eb";}
function setTheme(t){rootEl.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}paintTheme();}
$("thl").onclick=()=>setTheme("light");$("thd").onclick=()=>setTheme("dark");
mq.addEventListener&&mq.addEventListener("change",paintTheme);paintTheme();
let SB,user=null,view="me",ctx=null,drag=null;
let mine=new Map(),sel=new Set(),pmode="paint",pdirty=false;          // cá nhân
let teams=[],team=null,members=[],busy=[],tmine=new Map(),tview="mine",dirty=false; // nhóm

const uname=()=>(user.user_metadata&&(user.user_metadata.full_name||user.user_metadata.name))||user.email.split("@")[0];
const K=(d,h)=>d+"|"+h;
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
let weekStart=mondayOf(new Date()),selDate=fmt(new Date());
const wkDates=()=>[...Array(7).keys()].map(i=>addD(weekStart,i));
const wkRange=()=>[fmt(weekStart),fmt(addD(weekStart,6))];
const dm=d=>pad(d.getDate())+"/"+pad(d.getMonth()+1);

/* ---------- lưới ---------- */
function legend(){const n="<span><i style='background:var(--head);border:1px solid var(--bd)'></i>";
  if(view==="team"&&tview==="res")return"<div class='legend'><span><i style='background:var(--free)'></i>Tất cả cùng rảnh</span>"+n+"Có người bận (số = số người)</span></div>";
  return"<div class='legend'><span><i style='background:var(--ac)'></i>Giờ bận</span>"+n+"Giờ rảnh</span></div>";}
function grid(fn){
  const ds=wkDates(),today=fmt(new Date());
  let s="<div class='wrap'><table id='g'><tr><th class='t'></th>"+ds.map((d,i)=>{const f=fmt(d);return"<th class='"+(f===today?"today ":"")+(f===selDate?"selday":"")+"'>"+DAYS[i]+"<br><small>"+dm(d)+"</small></th>"}).join("")+"</tr>";
  for(const h of H){s+="<tr><th class='t'>"+h+":00</th>";
    for(const d of ds){const k=K(fmt(d),h),c=fn(k);s+="<td class='c "+c.cls+"' data-k='"+k+"' title='"+esc(c.tip||"")+"'>"+esc(c.txt||"")+"</td>";}
    s+="</tr>";}

const NC=8,hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return 1+h%NC};

function noteBlocks(){const out=[],m=store();
  wkDates().forEach((dt,di)=>{const f=fmt(dt);let cur=null;
    for(let h=0;h<24;h++){const k=K(f,h),n=m.get(k);

function cellOf(k){const m=store(),sl=sel.has(k)?" sel":"";
  if(!m.has(k))return{cls:sl.trim()};
  const n=m.get(k),[d,h]=k.split("|"),first=!(+h>0&&n&&m.get(K(d,+h-1))===n);

let polls=[],pollErr=null,chatMsgs=[],chatTeam=null,chatErr=null;
const VD=["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"],p2=n=>String(n).padStart(2,"0");
const hm=d=>p2(d.getHours())+":"+p2(d.getMinutes()),dmy=d=>p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear();
function dayLabel(d){const t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  return dmy(d)===dmy(t)?"Hôm nay":dmy(d)===dmy(y)?"Hôm qua":VD[d.getDay()]+", "+dmy(d);}
async function loadChat(){chatErr=null;
  const r=await SB.from("team_messages").select("*").eq("team_id",team.id).order("created_at",{ascending:false}).limit(200);
  if(r.error){chatErr=r.error.message;chatMsgs=[];return;}chatMsgs=(r.data||[]).reverse();}
async function pollChat(){if(!team||chatTeam!==team.id||chatErr)return;
  const last=chatMsgs.length?chatMsgs[chatMsgs.length-1].created_at:null;
  let q=SB.from("team_messages").select("*").eq("team_id",team.id).order("created_at",{ascending:true}).limit(200);if(last)q=q.gte("created_at",last);
  const r=await q;if(r.error||!r.data)return;
  const seen=new Set(chatMsgs.map(m=>m.id)),add=r.data.filter(m=>!seen.has(m.id));if(!add.length)return;
  chatMsgs=chatMsgs.concat(add).slice(-300);renderChat();}
function renderChat(stick,top){const el=$("cl");if(!el)return;
  const near=el.scrollHeight-el.scrollTop-el.clientHeight<60;
  if(chatErr){el.innerHTML=`<div class="mut" style="padding:6px">⚠️ Chưa dùng được chat: ${esc(chatErr)}.<br>Hãy chạy file <b>setup_chat.sql</b> trong Supabase → SQL Editor.</div>`;return;}
  let day="",h="";
  chatMsgs.forEach(m=>{const d=new Date(m.created_at),dl=dayLabel(d),mine=m.user_id===user.id;
    if(dl!==day){day=dl;h+=`<div class="cday">${esc(dl)}</div>`;}
    h+=`<div class="cm ${mine?"me":""}"><div class="ch"><b>${mine?"Bạn":esc(m.user_name)}</b> · <span title="${dmy(d)} ${hm(d)}:${p2(d.getSeconds())}">${hm(d)}</span></div><div class="cb">${esc(m.content)}</div></div>`;});
  el.innerHTML=h||"<div class='mut' style='text-align:center;padding:12px'>Chưa có tin nhắn nào. Hãy gửi lời chào đầu tiên 👋</div>";
  if(stick===true||(stick===undefined&&near))el.scrollTop=el.scrollHeight;else if(top!=null)el.scrollTop=top;}
async function sendChat(){const i=$("ci"),t=i.value.trim();if(!t||chatErr)return;i.value="";
  const r=await SB.from("team_messages").insert({team_id:team.id,user_id:user.id,user_name:uname(),content:t}).select().single();
  if(r.error){i.value=t;return say("Lỗi gửi tin: "+r.error.message);}
  if(!chatMsgs.find(m=>m.id===r.data.id))chatMsgs.push(r.data);renderChat(true);i.focus();}
const chatCard=()=>`<aside class="card side chat"><h2>💬 Chat nhóm</h2><div class="cl" id="cl"></div><div class="row cin"><input id="ci" class="sp" maxlength="500" placeholder="Nhập tin nhắn…" autocomplete="off"${chatErr?" disabled":""}><button class="p" id="cs">Gửi</button></div></aside>`;
const freeCard=()=>`<aside class="card side notes"><h2>🟢 Khung giờ rảnh chung</h2><div class="mut" style="font-size:12px;margin-top:-6px">Mọi người đều rảnh trong tuần đang xem</div><div id="fr" class="free-list"></div></aside>`;
async function loadPolls(){polls=[];pollErr=null;if(!team)return;
  const r=await SB.from("polls").select("*,poll_options(id,label,position),poll_votes(option_id,user_id)").eq("team_id",team.id).order("created_at",{ascending:false});
  if(r.error)pollErr=r.error.message;else polls=r.data||[];}
async function loadTeam(reset){
  if(!team)return;
  const[a,b]=wkRange();
  const[m,z]=await Promise.all([SB.from("team_members").select("*").eq("team_id",team.id),SB.from("team_busy").select("*").eq("team_id",team.id).gte("slot_date",a).lte("slot_date",b)]);
  if(m.error||z.error)return say("Lỗi tải: "+(m.error||z.error).message);
  members=m.data||[];busy=z.data||[];await loadPolls();if(chatTeam!==team.id){chatTeam=team.id;chatMsgs=[];await loadChat();}
  if(reset){dirty=false;sel=new Set();}
  if(reset||!dirty)tmine=new Map(busy.filter(x=>x.user_id===user.id).map(x=>[K(x.slot_date,x.hour),x.note||""]));
  if(reset||view==="team")drawTeam();
}
const me=()=>members.find(m=>m.user_id===user.id)||{};
function noteOf(id,k){if(id===user.id)return tmine.get(k)||"";const[d,h]=k.split("|");return(busy.find(x=>x.user_id===id&&x.slot_date===d&&x.hour==h)||{}).note||"";}
function renderMembers(){const el=$("ml");if(!el||!team)return;const q=($("mq").value||"").trim().toLowerCase(),done=members.filter(m=>m.done).length;
  $("mh").textContent="👥 Thành viên ("+members.length+")";$("ms").textContent=team.name+" · đã chốt "+done+"/"+members.length;
  const list=members.filter(m=>(m.name||"").toLowerCase().includes(q)).sort((a,b)=>(+!!a.done-+!!b.done)||(a.name||"").localeCompare(b.name||"","vi"));
  el.innerHTML=list.length?list.map(m=>`<div class="mrow"><span class="av">${esc((m.name||"?").trim().charAt(0).toUpperCase())}</span><span class="mn">${esc(m.name)}${m.user_id===user.id?" <small class='mut'>(Bạn)</small>":""}</span><span class="chip ${m.done?"ok":""}">${m.done?"✓ Đã chốt":"… Chưa chốt"}</span></div>`).join(""):"<div class='mut' style='padding:12px'>Không tìm thấy thành viên.</div>";}
function openMembers(){$("mq").value="";renderMembers();$("mem").hidden=false;}
function busyOf(k){const[d,h]=k.split("|");const ids=new Set(busy.filter(x=>x.slot_date===d&&x.hour==h&&x.user_id!==user.id).map(x=>x.user_id));if(tmine.has(k))ids.add(user.id);return[...ids];}
function pollCard(p){
  const opts=[...(p.poll_options||[])].sort((a,b)=>a.position-b.position),votes=p.poll_votes||[],total=votes.length,voters=new Set(votes.map(v=>v.user_id)).size;
  const myV=new Set(votes.filter(v=>v.user_id===user.id).map(v=>v.option_id)),cnt=o=>votes.filter(v=>v.option_id===o.id).length,max=Math.max(0,...opts.map(cnt));
  const nm=id=>(members.find(m=>m.user_id===id)||{}).name||"?";
  return `<div class="pcard ${p.closed?"closed":""}" data-p="${p.id}"><div class="row"><h3 class="sp">${esc(p.title)}</h3><span class="tag ${p.closed?"":"open"}">${p.closed?"Đã đóng":"Đang mở"}</span></div>
  <div class="pmeta">${esc(p.created_by_name||"")} · ${p.multi?"chọn nhiều":"chọn một"} · ${voters}/${members.length} người đã vote</div>
  ${opts.map(o=>{const vs=votes.filter(v=>v.option_id===o.id),c=vs.length,pc=total?Math.round(c/total*100):0,names=vs.map(v=>nm(v.user_id));
   return `<button class="popt ${myV.has(o.id)?"on":""} ${c&&c===max?"lead":""}" data-o="${o.id}"><span class="fill" style="width:${pc}%"></span><span class="in2"><span>${myV.has(o.id)?"✓ ":""}${esc(o.label)}</span><span class="cnt">${c} phiếu · ${pc}%</span></span></button>${c?`<div class="pvoters" title="${esc(names.join(", "))}">${esc(names.slice(0,4).join(", "))}${names.length>4?" +"+(names.length-4):""}</div>`:""}`}).join("")}
  ${p.created_by===user.id?`<div class="row"><button class="pa" data-a="close">${p.closed?"Mở lại":"Đóng bình chọn"}</button><button class="pa" data-a="del">Xóa</button></div>`:""}</div>`;}
function votePane(){
  const body=pollErr?`<div class="mut" style="padding:8px">⚠️ Chưa tải được bình chọn: ${esc(pollErr)}.<br>Hãy chạy file <b>setup_vote.sql</b> trong Supabase → SQL Editor để tạo bảng bình chọn.</div>`
   :!polls.length?`<div class="mut" style="padding:8px">Chưa có bình chọn nào. Bấm “＋ Tạo bình chọn” ở cột trái để bắt đầu.</div>`
   :`<div class="polls" id="pl">${polls.map(pollCard).join("")}</div>`;
  return `<div class="ptop"><h2 style="margin:0;font-size:17px">🗳️ Bình chọn của nhóm</h2><span class="sp"></span><span class="mut">${polls.length} bình chọn</span></div>${body}`;}
async function castVote(pid,oid){
  const p=polls.find(x=>x.id===pid);if(!p)return;if(p.closed)return say("Bình chọn này đã đóng.");
  const mv=(p.poll_votes||[]).filter(v=>v.user_id===user.id).map(v=>v.option_id);let r;
  if(mv.includes(oid))r=await SB.from("poll_votes").delete().eq("option_id",oid).eq("user_id",user.id);
  else{if(!p.multi&&mv.length){r=await SB.from("poll_votes").delete().eq("poll_id",pid).eq("user_id",user.id);if(r.error)return say("Lỗi: "+r.error.message);}
    r=await SB.from("poll_votes").insert({poll_id:pid,option_id:oid,user_id:user.id});}
  if(r.error)return say("Lỗi: "+r.error.message);await loadTeam(false);}
async function pollAction(pid,a){
  let r;if(a==="close"){const p=polls.find(x=>x.id===pid);r=await SB.from("polls").update({closed:!p.closed}).eq("id",pid);}
  else{if(!confirm("Xóa bình chọn này?"))return;r=await SB.from("polls").delete().eq("id",pid);}
  if(r.error)return say("Lỗi: "+r.error.message);await loadTeam(false);}
function addOpt(v){const d=document.createElement("div");d.className="row";
  d.innerHTML='<input class="sp po" maxlength="80" placeholder="Phương án"><button class="rm" title="Xóa phương án">×</button>';
  d.querySelector("input").value=v||"";
  d.querySelector(".rm").onclick=()=>{if(document.querySelectorAll("#po .row").length>2)d.remove();else say("Cần ít nhất 2 phương án.")};
  $("po").appendChild(d);return d;}
function openPollForm(){$("pt").value="";$("po").innerHTML="";addOpt("");addOpt("");$("pmu").checked=false;$("pcm").hidden=false;$("pt").focus();}
async function submitPoll(){
  const title=$("pt").value.trim(),opts=[...new Set([...document.querySelectorAll("#po .po")].map(i=>i.value.trim()).filter(Boolean))];
  if(!title)return say("Hãy nhập tiêu đề bình chọn.");if(opts.length<2)return say("Cần ít nhất 2 phương án khác nhau.");
  $("pgo").disabled=true;
  const r=await SB.from("polls").insert({team_id:team.id,title,multi:$("pmu").checked,created_by:user.id,created_by_name:uname()}).select().single();
  if(r.error){$("pgo").disabled=false;return say("Lỗi: "+r.error.message);}
  const r2=await SB.from("poll_options").insert(opts.map((label,i)=>({poll_id:r.data.id,label,position:i})));
  $("pgo").disabled=false;
  if(r2.error){await SB.from("polls").delete().eq("id",r.data.id);return say("Lỗi: "+r2.error.message);}
  $("pcm").hidden=true;say("✓ Đã tạo bình chọn");await loadTeam(false);}
function drawTeam(){
  const w0=document.querySelector(".wrap,.polls"),st=w0?w0.scrollTop:0,ntv=$("nt")?$("nt").value:null;
  const cl0=$("cl"),cNear=!cl0||cl0.scrollHeight-cl0.scrollTop-cl0.clientHeight<60,cTop=cl0?cl0.scrollTop:0,civ=$("ci")?$("ci").value:"",cif=!!document.activeElement&&document.activeElement.id==="ci";
  const done=members.filter(m=>m.done).length,all=members.length,allDone=all>0&&done===all,pct=all?Math.round(done/all*100):0,openP=polls.filter(x=>!x.closed).length;
  $("body").innerHTML=`<div class="split split3"><aside class="card side"><div class="row"><button id="bk">← Nhóm</button></div><h2>${esc(team.name)}</h2>
   <div class="row">Mã: <span class="code">${esc(team.code)}</span><span class="sp"></span><button id="cp">Sao chép</button></div>
   <button id="mb" class="mem-btn"><span>👥 Thành viên (${all})</span><small>${done}/${all} đã chốt</small></button><div class="bar"><i style="width:${pct}%"></i></div>
   <div class="seg"><button id="v1" class="${tview==="mine"?"on":""}">Lịch bận của tôi</button><button id="v2" class="${tview==="res"?"on":""}">Kết quả chung</button></div>
   <button id="vb" class="mem-btn ${tview==="vote"?"on":""}"><span>🗳️ Bình chọn</span><small>${openP} đang mở</small></button>
   ${tview==="mine"?`${noteSide()}<button id="sv">Lưu</button><button class="p" id="ch">${me().done?"Bỏ chốt để sửa":"Chốt lịch của tôi"}</button>`
   :tview==="vote"?`<p class="mut" style="margin:0">Tạo câu hỏi và các phương án để cả nhóm cùng bỏ phiếu. Bấm vào một phương án để vote, bấm lại để bỏ phiếu.</p><span class="sp"></span><button class="p" id="pc">＋ Tạo bình chọn</button>`
   :`<p class="mut" style="margin:0">${allDone?"✅ Mọi người đã chốt. Ô xanh lá = tất cả cùng rảnh.":"⏳ Mới "+done+"/"+all+" người chốt, kết quả tạm tính."} Ô xám có số = số người bận.</p>`}
   </aside>
   <section class="card pane">${tview==="vote"?votePane():`<div class="ptop">${navBar()}<span class="sp"></span>${legend()}</div>${grid(k=>ctx.cell(k))}`}</section><div class="rcol">${chatCard()}${tview==="mine"?noteCard():tview==="res"?freeCard():""}</div></div>`;
  const w=document.querySelector(".wrap,.polls");if(w)w.scrollTop=st;
  if(tview!=="vote")bindNav();
  $("bk").onclick=async()=>{await flush();team=null;sel=new Set();listTeams()};
  $("cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(team.code);say("Đã sao chép mã "+team.code)};
  renderChat(cNear,cTop);$("ci").value=civ;if(cif)$("ci").focus();
  $("ci").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();sendChat()}};$("cs").onclick=sendChat;
  $("mb").onclick=openMembers;if($("mem")&&!$("mem").hidden)renderMembers();
  $("v1").onclick=async()=>{await flush();tview="mine";sel=new Set();drawTeam()};$("v2").onclick=async()=>{await flush();tview="res";sel=new Set();drawTeam()};
  $("vb").onclick=async()=>{await flush();tview="vote";sel=new Set();drawTeam()};
  if(tview==="mine"){bindNotes();if(ntv!==null&&$("nt")&&fillNote===null)$("nt").value=ntv;$("sv").onclick=()=>saveTeam(false);$("ch").onclick=()=>me().done?unchot():saveTeam(true);}
  else if(tview==="vote"){$("pc").onclick=openPollForm;
    const pl=$("pl");if(pl)pl.onclick=ev=>{const c=ev.target.closest(".pcard");if(!c)return;const a=ev.target.closest("[data-a]"),o=ev.target.closest("[data-o]");
      if(a)pollAction(c.dataset.p,a.dataset.a);else if(o)castVote(c.dataset.p,o.dataset.o);};}
  else showFree();
}
function setTeamCtx(){
  if(tview==="vote"){ctx={cell:()=>({cls:""})};return;}
  if(tview==="mine"){ctx=team&&!me().done?mkCtx():{cell:cellOf};return;}
  ctx={cell:k=>{
    const b=busyOf(k);if(!b.length)return{cls:"free",txt:"✓"};
    return{cls:"part",txt:b.length,tip:"Bận: "+b.map(i=>{const nm=(members.find(m=>m.user_id===i)||{}).name,nt=noteOf(i,k);return nm+(nt?" ("+nt+")":"")}).join(", ")};}};
}
function showFree(){
  let out="";
  wkDates().forEach((dt,d)=>{const f=fmt(dt);let r=[],s=null;
    for(let h=0;h<=24;h++){const free=h<24&&!busyOf(K(f,h)).length;if(free&&s===null)s=h;if(!free&&s!==null){r.push(s+":00–"+h+":00");s=null;}}
    if(r.length)out+="<div><b>"+DAYS[d]+" "+dm(dt)+":</b> "+r.join(", ")+"</div>";});
  $("fr").innerHTML=(out||"<div class='mut'>Không có khung giờ nào trùng.</div>");
}
async function saveTeam(chot,silent){
  if(!silent)say("Đang lưu…");
  const[a,b]=wkRange();
  let r=await SB.from("team_busy").delete().eq("team_id",team.id).eq("user_id",user.id).gte("slot_date",a).lte("slot_date",b);if(r.error)return say("Lỗi: "+r.error.message);
  const rows=[...tmine].map(([k,note])=>{const[d,h]=k.split("|");return{team_id:team.id,user_id:user.id,slot_date:d,hour:+h,note}});let warn="";
  if(rows.length){r=await SB.from("team_busy").insert(rows);
    if(r.error&&/note/i.test(r.error.message)){r=await SB.from("team_busy").insert(rows.map(({note,...x})=>x));warn=" (chưa lưu được ghi chú: cần thêm cột note vào bảng team_busy)";}
    if(r.error)return say("Lỗi: "+r.error.message);}
  if(chot){r=await SB.from("team_members").update({done:true}).eq("team_id",team.id).eq("user_id",user.id);if(r.error)return say("Lỗi: "+r.error.message);}
  dirty=false;
  if(silent){say("Đã tự lưu tuần vừa chỉnh"+warn);return;}
  await loadTeam(true);say((chot?"✓ Đã chốt lịch":"✓ Đã lưu")+warn);
}
async function unchot(){
  const r=await SB.from("team_members").update({done:false}).eq("team_id",team.id).eq("user_id",user.id);
  if(r.error)return say("Lỗi: "+r.error.message);await loadTeam(true);
}

/* ---------- vẽ lại theo ngữ cảnh ---------- */
const _meView=meView,_drawMe=drawMe,_drawTeam=drawTeam;
meView=async function(){setMeCtx();await _meView();};
drawMe=function(){setMeCtx();_drawMe();};
drawTeam=function(){setTeamCtx();_drawTeam();};

/* ---------- khởi động ---------- */
function start(){
  try{
    if(SUPABASE_URL==="DAN_PROJECT_URL"||SUPABASE_KEY==="DAN_ANON_PUBLIC_KEY"){$("app").innerHTML="<div class='card'>Chưa cấu hình Supabase. Mở file index.html và dán Project URL + anon key.</div>";return;}
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SUPABASE_URL.trim())){$("app").innerHTML="<div class='card'>Project URL chưa đúng. Phải có dạng https://xxxxxxxx.supabase.co (không thêm /rest/v1 hay dấu cách).</div>";return;}
    SB=supabase.createClient(SUPABASE_URL.trim(),SUPABASE_KEY.trim());
    $("out").onclick=()=>SB.auth.signOut();
    SB.auth.onAuthStateChange((ev,session)=>{
      try{
        user=session?session.user:null;
        $("out").hidden=!user;$("who").innerHTML=user?"<i class='av'>"+esc(uname().charAt(0).toUpperCase())+"</i>"+esc(uname()):"";
        if(!user){team=null;authView();return;}
        if(ev==="SIGNED_IN"||ev==="INITIAL_SESSION"){shell();go();}
      }catch(e){showErr(e)}
    });
    setInterval(()=>{const a=document.activeElement;if(user&&view==="team"&&team&&drag===null&&!dirty&&!(a&&["ci","nt"].includes(a.id)&&a.value))loadTeam(false);},15000);
    setInterval(()=>{if(user&&view==="team"&&team)pollChat();},3000);
  }catch(e){showErr(e)}
}
function showErr(e){$("app").innerHTML="<div class='card'><b>Lỗi khởi động:</b> "+esc(e&&e.message||e)+"</div>";}
window.addEventListener("error",e=>{if(!$("app").innerHTML)showErr(e.message)});
if(window.supabase)start();
else{const sc=document.createElement("script");sc.src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
  sc.onload=start;sc.onerror=()=>{$("app").innerHTML="<div class='card'>Không tải được thư viện Supabase. Kiểm tra mạng hoặc tắt trình chặn quảng cáo rồi tải lại.</div>"};
  document.head.appendChild(sc);}
</script>
