<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timesheet</title>
<script>try{var _t=localStorage.getItem("theme");if(_t)document.documentElement.dataset.theme=_t}catch(e){}</script>
<meta name="theme-color" content="#2563eb">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f7fd;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#dbe4f0;--ac:#2563eb;--acd:#1d4ed8;--acs:#eaf2ff;--free:#10b981;--head:#eef3fb;--sh:0 1px 2px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1a;--card:#0f1726;--tx:#e6e9f0;--mut:#8b95a7;--bd:#1f2a40;--ac:#5b9dff;--acd:#4a8af0;--acs:#16264a;--free:#22c08a;--head:#17223a;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0a0f1a;--card:#0f1726;--tx:#e6e9f0;--mut:#8b95a7;--bd:#1f2a40;--ac:#5b9dff;--acd:#4a8af0;--acs:#16264a;--free:#22c08a;--head:#17223a;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3)}
:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd)}
.top .in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;color:#fff;flex:none}
.brandname{font-size:18px;letter-spacing:-.2px}
#who{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
#who:empty{display:none}
.av{width:28px;height:28px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font:700 13px/1 inherit;font-style:normal}
main{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
input{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
button{padding:9px 15px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
button:hover{background:var(--head)}button:active{transform:translateY(1px)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.p:hover{background:var(--acd)}
button.on{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.seg{display:inline-flex;background:var(--head);padding:4px;border-radius:12px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.mut{color:var(--mut);font-size:13px}
.wrap{overflow:auto;max-height:68vh;border:1px solid var(--bd);border-radius:12px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:620px;user-select:none;touch-action:pan-x pan-y}
body.paintmode table{touch-action:none}
.pmbtn{display:none}
@media (pointer:coarse){.pmbtn{display:inline-block}.wrap{max-height:none}}
th,td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);text-align:center;padding:0;height:27px;font-size:11px}
th{background:var(--head);font-size:12px;font-weight:600;padding:6px 4px}
tr:first-child th{position:sticky;top:0;z-index:2}
th.t{width:56px;color:var(--mut);position:sticky;left:0;z-index:1;font-weight:500}
tr:first-child th.t{z-index:3}
tr:nth-child(6n+2) td,tr:nth-child(6n+2) th.t{border-top:2px solid var(--bd)}
td.c{cursor:pointer;max-width:90px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
td.c:hover{background:var(--acs)}
td.busy,td.busy:hover{background:var(--ac);color:#fff}
td.sel{outline:3px solid #f59e0b;outline-offset:-3px}
td.free,td.free:hover{background:var(--free);color:#fff;font-weight:700}
td.part,td.part:hover{background:var(--head);color:var(--mut);font-weight:600}
.nav{margin-bottom:12px}.nav input{padding:7px 10px}.nav b{font-size:14px;margin-left:4px}
th.today{color:var(--ac)}th.selday{background:var(--acs)}th small{font-weight:500;color:var(--mut);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:0 0 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.chip{display:inline-block;background:var(--head);border-radius:99px;padding:3px 12px;font-size:13px;margin:3px 3px 0 0}
.chip.ok{background:color-mix(in srgb,var(--free) 18%,transparent);color:var(--free);font-weight:600}
.teams button{margin:0 6px 6px 0}
.code{font:700 17px ui-monospace,Consolas,monospace;letter-spacing:3px;background:var(--acs);color:var(--ac);padding:3px 12px;border-radius:10px}
details summary{cursor:pointer;font-weight:600}details ul{margin:10px 0 0;padding-left:20px}details li{margin:4px 0}
#app:has(.auth){min-height:calc(100vh - 150px);display:flex;align-items:center;justify-content:center}
.auth{display:grid;grid-template-columns:1.1fr 1fr;width:100%;max-width:860px;margin:0 auto;border-radius:20px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bd)}
.brand{padding:36px 32px;background:linear-gradient(150deg,#2563eb,#1e40af);color:#fff}
.brand h2{font-size:26px;line-height:1.25;margin:18px 0 10px}.brand p{opacity:.85;margin:0 0 16px}
.brand ul{margin:0;padding:0;list-style:none}.brand li{margin:8px 0;padding-left:26px;position:relative;opacity:.95}
.brand li:before{content:"✓";position:absolute;left:0;font-weight:700}
.auth .form{border:0;border-radius:0;box-shadow:none;margin:0;padding:32px 28px;display:flex;flex-direction:column;justify-content:center}
.auth .form .col{display:flex;flex-direction:column;gap:10px}
.gbtn{display:flex;gap:10px;align-items:center;justify-content:center;padding:11px}
.gbtn b{font-size:17px;background:linear-gradient(90deg,#4285f4,#ea4335,#fbbc05,#34a853);-webkit-background-clip:text;background-clip:text;color:transparent}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}
#msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;box-shadow:var(--sh);font-size:14px;max-width:92vw;z-index:30}
#msg:empty{display:none}
@media (max-width:700px){.auth{grid-template-columns:1fr}.brand{padding:24px}.brand h2{font-size:21px}.card{padding:14px}}

/* ===== Giao diện sau đăng nhập: toàn màn hình, nằm ngang ===== */
body:has(.shell) main{max-width:none}
body:has(.shell) .top .in{max-width:none}
.shell{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;align-items:center;gap:10px}
.split{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px}
.split>.card,.cards3>.card{margin:0}
.side{display:flex;flex-direction:column;gap:12px;padding:16px;min-height:0;overflow:auto}
.side h2{margin:0;font-size:18px}
.side button{width:100%}
.side .row button{width:auto}
.side .seg{display:flex}.side .seg button{flex:1;width:auto}
.pane{display:flex;flex-direction:column;min-height:0;padding:12px}
.ptop{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;margin-bottom:10px}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0}
.nav b{margin-left:6px;font-size:15px}
.legend{margin:0}
.wrap{position:relative;flex:1;height:72vh;min-height:420px;max-height:none}
.wrap table{position:absolute;left:0;top:0;width:100%;height:100%;min-height:520px;min-width:640px;table-layout:fixed}
td.c{max-width:none}
th.t{width:56px}
th,td{font-size:12px}
.free-list{flex:1;min-height:0;overflow:auto}
.free-list>div{padding:5px 0;border-bottom:1px dashed var(--bd)}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:40;padding:16px}
.modal[hidden]{display:none}
.modal .card{max-width:580px;max-height:90vh;overflow:auto;margin:0}
.modal ul{margin:10px 0 0;padding-left:20px}.modal li{margin:6px 0}
@media (min-width:901px) and (min-height:560px){
 body:has(.shell){height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
 body:has(.shell) main{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px}
 #app:has(.shell){flex:1;min-height:0;display:flex;flex-direction:column}
 .shell{flex:1;min-height:0}
 #body{flex:1;min-height:0}
 .split{height:100%}
 .wrap{height:auto}
}
@media (max-width:900px){.split{grid-template-columns:1fr}.cards3{grid-template-columns:1fr}.side{overflow:visible}}

/* ===== Ghi chú phong phú ===== */
.n1{--nc:#0d9488}td.busy.n1,td.busy.n1:hover{background:var(--nc);color:#fff}
.n2{--nc:#7c3aed}td.busy.n2,td.busy.n2:hover{background:var(--nc);color:#fff}
.n3{--nc:#e11d48}td.busy.n3,td.busy.n3:hover{background:var(--nc);color:#fff}
.n4{--nc:#d97706}td.busy.n4,td.busy.n4:hover{background:var(--nc);color:#fff}
.n5{--nc:#db2777}td.busy.n5,td.busy.n5:hover{background:var(--nc);color:#fff}
.n6{--nc:#15803d}td.busy.n6,td.busy.n6:hover{background:var(--nc);color:#fff}
.n7{--nc:#4f46e5}td.busy.n7,td.busy.n7:hover{background:var(--nc);color:#fff}
.n8{--nc:#ea580c}td.busy.n8,td.busy.n8:hover{background:var(--nc);color:#fff}
td.busy{font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none;margin-top:6px}
.dot[class*=" n"]{background:var(--nc)}
.nl{flex:1;min-height:90px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.ni{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;background:var(--bg)}
.ni:hover{border-color:var(--ac)}
.ni .nt{flex:1;min-width:0;font-size:13px;line-height:1.35}.ni .nt div{overflow-wrap:anywhere}
.side .nx{width:auto;padding:0 8px;border:0;background:transparent;color:var(--mut);font-size:18px;line-height:1.2}
.nbox{display:flex;flex-direction:column;gap:8px}
.qn{display:flex;gap:6px;flex-wrap:wrap}
.side .qb{width:auto;padding:3px 10px;font-size:12px;border-radius:99px;font-weight:500}
.side h3{margin:0;font-size:13px;color:var(--mut);font-weight:600}

.thm{padding:3px;flex:none}.thm button{padding:5px 10px;font-size:13px;display:inline-flex;gap:5px;align-items:center}
@media (max-width:600px){.thm button span{display:none}.thm button{padding:5px 9px}}

/* ===== Thành viên (cửa sổ riêng) ===== */
.modal .card{width:min(580px,100%)}
.mem-btn{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mem-btn small{color:var(--mut);font-weight:500;font-size:12px}
.bar{height:6px;border-radius:99px;background:var(--head);overflow:hidden;margin-top:-4px}.bar i{display:block;height:100%;background:var(--free);transition:width .3s}
.mlist{margin-top:10px;max-height:52vh;overflow:auto;display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--bd)}
.mrow .mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .chip{margin:0;flex:none}
.av{width:30px;height:30px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:700;flex:none}

/* ===== Bình chọn ===== */
.mem-btn.on{border-color:var(--ac);background:var(--acs);color:var(--ac)}
.polls{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;align-content:start;padding:2px}
.pcard{border:1px solid var(--bd);border-radius:14px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.pcard h3{margin:0;font-size:16px;overflow-wrap:anywhere}
.pmeta{font-size:12px;color:var(--mut)}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--head);color:var(--mut);white-space:nowrap;font-weight:600}
.tag.open{background:color-mix(in srgb,var(--free) 18%,transparent);color:var(--free)}
.popt{position:relative;display:block;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);overflow:hidden;cursor:pointer;font-weight:500}
.popt .fill{position:absolute;left:0;top:0;bottom:0;background:var(--acs);transition:width .3s}
.popt .in2{position:relative;display:flex;justify-content:space-between;gap:10px;align-items:center}
.popt .in2>span:first-child{overflow-wrap:anywhere}.popt .cnt{white-space:nowrap;color:var(--mut);font-size:12px}
.popt.on{border-color:var(--ac)}.popt.on .fill{background:color-mix(in srgb,var(--ac) 28%,transparent)}
.popt.lead .cnt{color:var(--tx);font-weight:700}
.pcard.closed .popt{cursor:default}
.pvoters{font-size:11px;color:var(--mut);margin:-3px 4px 2px}
.pa{width:auto;padding:4px 10px;font-size:12px}
#pcm .rm{width:auto;padding:4px 10px}
#po{display:flex;flex-direction:column;gap:8px;margin:10px 0}

/* ===== 3 cột: thao tác | lịch | ghi chú ===== */
.split3{grid-template-columns:290px minmax(0,1fr) 280px}
.notes h2{font-size:16px}
@media (max-width:1280px){.split3{grid-template-columns:250px minmax(0,1fr) 230px}}
@media (max-width:900px){.split3{grid-template-columns:1fr}.notes .nl{max-height:260px}}

/* ===== Cột phải: Chat + Ghi chú / Khung giờ rảnh ===== */
.split3{grid-template-columns:290px minmax(0,1fr) 320px}
@media (max-width:1280px){.split3{grid-template-columns:250px minmax(0,1fr) 270px}}
@media (max-width:900px){.split3{grid-template-columns:1fr}}
.rcol{display:flex;flex-direction:column;gap:14px;min-height:0}
.rcol>.card{flex:1 1 0;min-height:0;margin:0}
@media (max-width:900px){.rcol>.card{flex:none;height:360px}}
.chat,.notes{overflow:hidden}
.cl{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.cday{align-self:center;font-size:11px;color:var(--mut);background:var(--head);padding:2px 10px;border-radius:99px;margin:4px 0}
.cm{display:flex;flex-direction:column;max-width:88%;align-self:flex-start}
.cm.me{align-self:flex-end;align-items:flex-end}
.cm .ch{font-size:11px;color:var(--mut);margin:0 6px 2px}.cm .ch b{color:var(--tx);font-weight:600}
.cm .cb{background:var(--head);padding:7px 11px;border-radius:14px 14px 14px 4px;overflow-wrap:anywhere;white-space:pre-wrap;font-size:13.5px;line-height:1.4}
.cm.me .cb{background:var(--ac);color:#fff;border-radius:14px 14px 4px 14px}
.side .cin{flex-wrap:nowrap}.side .cin button{width:auto}

/* ===== Lịch sử vote ===== */
.side .pa{width:auto}
.hi{align-items:center}
.hi .nt .mut{font-size:12px}
.hi .res{margin-top:2px}
#prm .popt{cursor:default}
#prm .pvoters{font-size:12px;white-space:normal;margin:-2px 4px 6px}

/* ===== Áp dụng lịch cá nhân vào nhóm ===== */
#apb h3{margin:16px 0 6px;font-size:13px;color:var(--mut);font-weight:600}
.aprow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:8px}
.aprow:hover{background:var(--head)}
.aprow input{padding:0;width:17px;height:17px;flex:none;accent-color:var(--ac)}
.aprow .apn{flex:1;min-width:0;overflow-wrap:anywhere}
.aprow small{color:var(--mut);font-size:12px}
.aprow.opt{align-items:flex-start;border-bottom:0}
.aprow.opt input{margin-top:3px}

  return"<div class='legend'><span><i style='background:var(--ac)'></i>Giờ bận</span>"+n+"Giờ rảnh</span></div>";}
function grid(fn){
  const ds=wkDates(),today=fmt(new Date());
  let s="<div class='wrap'><table id='g'><tr><th class='t'></th>"+ds.map((d,i)=>{const f=fmt(d);return"<th class='"+(f===today?"today ":"")+(f===selDate?"selday":"")+"'>"+DAYS[i]+"<br><small>"+dm(d)+"</small></th>"}).join("")+"</tr>";
  for(const h of H){s+="<tr><th class='t'>"+h+":00</th>";
    for(const d of ds){const k=K(fmt(d),h),c=fn(k);s+="<td class='c "+c.cls+"' data-k='"+k+"' title='"+esc(c.tip||"")+"'>"+esc(c.txt||"")+"</td>";}
    s+="</tr>";}

async function flush(){if(view==="me"&&pdirty)await saveMe(true);else if(view==="team"&&team&&dirty&&tview==="mine")await saveTeam(false,true);}
function refreshCell(k,nb){const td=document.querySelector("td[data-k='"+k+"']");
  if(td&&ctx){const c=ctx.cell(k);td.className="c "+c.cls;td.textContent=c.txt||"";td.title=c.tip||"";}
  if(!nb){const[d,h]=k.split("|");[+h-1,+h+1].forEach(x=>{if(x>=0&&x<24)refreshCell(K(d,x),true)});}}
let paintTouch=false,handled=false;
document.addEventListener("pointerdown",e=>{const td=e.target.closest&&e.target.closest("td.c");handled=false;
  if(!td||!ctx||!ctx.start)return;
  if(e.pointerType!=="mouse"&&!paintTouch)return;   // cảm ứng: để trình duyệt cuộn, tô bằng sự kiện click
  handled=true;drag=ctx.start(td.dataset.k);e.preventDefault();ctx.apply(td.dataset.k,drag);});
document.addEventListener("click",e=>{const td=e.target.closest&&e.target.closest("td.c");
  if(handled){handled=false;return;}
  if(!td||!ctx||!ctx.start)return;
  ctx.apply(td.dataset.k,ctx.start(td.dataset.k));});
document.addEventListener("pointermove",e=>{if(drag===null||!ctx)return;const t=document.elementFromPoint(e.clientX,e.clientY);if(t&&t.dataset&&t.dataset.k)ctx.apply(t.dataset.k,drag);});
document.addEventListener("pointerup",()=>{drag=null});

function meetSlots(){const out=[],now=new Date();
  wkDates().forEach((dt,di)=>{const f=fmt(dt);
    for(let s0=7;s0+mDur<=22;s0++){let ok=true;for(let h=s0;h<s0+mDur;h++)if(busyOf(K(f,h)).length){ok=false;break;}
      if(!ok||new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),s0)<=now)continue;
      let cp=null,ct=false;for(let h=s0;h<s0+mDur;h++){const k=K(f,h);if(conf.p.has(k))cp=conf.p.get(k)||"Bận";if(conf.t.has(k))ct=true;}
      let sc=60-di*2;const mid=s0+mDur/2;
      if(mid>=9&&mid<=11.5)sc+=18;else if(mid>=14&&mid<=16.5)sc+=14;
      if(s0<8||s0+mDur>20)sc-=15;if(s0<13&&s0+mDur>12)sc-=10;if(cp)sc-=40;if(ct)sc-=30;
      out.push({dt,di,s:s0,e:s0+mDur,cp,ct,sc});}});
  out.sort((x,y)=>y.sc-x.sc||x.dt-y.dt||x.s-y.s);
  const pick=[];for(const x of out){if(pick.length>=6)break;if(!pick.some(y=>y.di===x.di&&x.s<y.e&&y.s<x.e))pick.push(x);}
  return pick;}

    const sc=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));
    const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("Không nén được ảnh.")),"image/jpeg",.82));
  }finally{URL.revokeObjectURL(url)}
}

const TOPICS=["Thông báo","Họp","Học tập","Công việc","Chia sẻ","Hỏi đáp"];
const TAGRE=/(?:^|\s)#[\p{L}\p{N}_-]+/gu,PH=/(?:\+?84|0)(?:[\s.-]?\d){8,10}/g,CD=/m[ãa]\s*(?:nhóm|nhom)?\s*[:：]?\s*([A-Za-z0-9]{6})\b/i;
const tagsOf=p=>[...new Set(((p.content||"").match(TAGRE)||[]).map(x=>x.trim().slice(1)))];
const rich=t=>esc(t).replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu,'$1<button class="htag" data-tag="$2">#$2</button>');
function tagBar(){const c={};feed.posts.forEach(p=>tagsOf(p).forEach(t=>c[t]=(c[t]||0)+1));const ks=Object.keys(c).sort((a,b)=>c[b]-c[a]);
  if(!ks.length)return"<div class='mut' style='margin:0 2px 10px;font-size:13px'>💡 Thêm #chủ-đề vào bài viết để mọi người lọc theo chủ đề.</div>";
  return"<div class='tfb'><span class='mut'>Lọc:</span><button class='tg "+(!feed.tag?"on":"")+"' data-tag=''>Tất cả ("+feed.posts.length+")</button>"+ks.map(t=>"<button class='tg "+(feed.tag===t?"on":"")+"' data-tag='"+esc(t)+"'>#"+esc(t)+" ("+c[t]+")</button>").join("")+"</div>";}
function quick(p){const t=p.content||"",out=[],seen=new Set();
  (t.match(PH)||[]).forEach(x=>{const n=x.replace(/[^\d+]/g,"");if(n.length>=9&&!seen.has(n)&&seen.size<2){seen.add(n);out.push(`<a class="btn qa" href="tel:${n}">📞 Gọi ${esc(x.trim())}</a>`)}});
  const c=t.match(CD);if(c){const code=c[1].toUpperCase();out.push(`<button class="qa" data-copy="${esc(code)}">📋 Sao chép mã ${esc(code)}</button>`);}
  return out.length?`<div class="row qrow">${out.join("")}</div>`:"";}
function copyText(t){const ok=()=>say("✓ Đã sao chép: "+t.slice(0,40));
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>say("Không sao chép được."));
  else{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){say("Không sao chép được.")}a.remove()}}

let notifs=[],nf="all",nSeen=null,nCh=null,nUser=null,nErr=null,pendTview=null;
const NIC={post_new:"📰",reaction:"😀",comment:"💬",reply:"↩️",join:"👋",leave:"🚪",poll_new:"🗳️",poll_closed:"🔒",chat:"💬",team_deleted:"🗑️"};
async function loadNotifs(){
  if(!user)return;
  const r=await SB.from("notifications").select("*").order("created_at",{ascending:false}).limit(60);
  if(r.error){nErr=r.error.message;notifs=[];renderBell();return;}
  nErr=null;const list=r.data||[];
  // đang mở đúng nhóm thì tin nhắn chat coi như đã đọc
  const auto=list.filter(n=>!n.read&&n.type==="chat"&&view==="team"&&team&&team.id===n.team_id&&document.visibilityState==="visible").map(n=>n.id);
  if(auto.length){list.forEach(n=>{if(auto.includes(n.id))n.read=true});SB.from("notifications").update({read:true}).in("id",auto).then(()=>{});}
  if(nSeen&&$("npn").hidden){const fresh=list.filter(n=>!n.read&&nSeen.get(n.id)!==n.created_at);
    if(fresh.length)say("🔔 "+fresh[0].body+(fresh.length>1?" (+"+(fresh.length-1)+" thông báo khác)":""));}
  nSeen=new Map(list.map(n=>[n.id,n.created_at]));
  notifs=list;renderBell();
}
function renderBell(){
  const b=$("bdg"),un=notifs.filter(n=>!n.read).length;
  if(b){b.hidden=!un;b.textContent=un>9?"9+":un;}
  document.title=(un?"("+(un>9?"9+":un)+") ":"")+"Timesheet";
  renderPanel();
}
function renderPanel(){
  const el=$("npn");if(!el||el.hidden)return;
  const un=c=>notifs.filter(n=>!n.read&&(c==="all"||n.cat===c)).length,tab=(k,t)=>`<button data-nf="${k}" class="${nf===k?"on":""}">${t}${un(k)?" ("+un(k)+")":""}</button>`;
  const list=notifs.filter(n=>nf==="all"||n.cat===nf);
  el.innerHTML=`<div class="nph"><b>🔔 Thông báo</b><span class="sp"></span><button class="pa" data-na="read" ${un("all")?"":"disabled"}>Đã đọc tất cả</button><button class="pa" data-na="clear" ${notifs.length?"":"disabled"}>Xoá tất cả</button></div>
   <div class="seg nfs">${tab("all","Tất cả")}${tab("team","Nhóm")}${tab("post","Bài viết")}</div>
   <div class="npl">${nErr?`<div class="mut" style="padding:14px">⚠️ Chưa dùng được thông báo: ${esc(nErr)}.<br>Hãy chạy đoạn SQL thông báo trong Supabase → SQL Editor.</div>`
   :list.length?list.map(n=>`<div class="nit ${n.read?"":"un"}" data-n="${n.id}"><span class="nic">${NIC[n.type]||"🔔"}</span><div class="nbody"><div class="nbd">${esc(n.body)}${n.cnt>1?" ("+n.cnt+" tin)":""}</div>${n.extra?`<div class="nex">${esc(n.extra)}</div>`:""}<div class="nmt" title="${dt(n.created_at)}">${ago(n.created_at)} · ${n.cat==="team"?"Nhóm":"Bài viết"}</div></div>${n.read?"":`<i class="ndot"></i>`}</div>`).join("")
   :`<div class="mut" style="padding:18px;text-align:center">Chưa có thông báo nào.</div>`}</div>`;
}
async function markRead(ids){
  ids=ids.filter(id=>{const n=notifs.find(x=>x.id===id);return n&&!n.read});if(!ids.length)return;
  notifs.forEach(n=>{if(ids.includes(n.id))n.read=true});renderBell();
  const r=await SB.from("notifications").update({read:true}).in("id",ids);if(r.error)say("Lỗi: "+r.error.message);
}
async function markAll(){
  notifs.forEach(n=>{n.read=true});renderBell();
  const r=await SB.from("notifications").update({read:true}).eq("user_id",user.id).eq("read",false);if(r.error)say("Lỗi: "+r.error.message);
}
async function clearAll(){
  if(!confirm("Xoá tất cả thông báo?"))return;
  const r=await SB.from("notifications").delete().eq("user_id",user.id);if(r.error)return say("Lỗi: "+r.error.message);
  notifs=[];renderBell();
}
async function openNotif(n){
  if(!n)return;markRead([n.id]);$("npn").hidden=true;
  await flush();
  if(n.cat==="post"){
    feed.focus=n.post_id||null;feed.ft=0;if(n.post_id&&(n.type==="comment"||n.type==="reply"))feed.openC.add(n.post_id);
    view="posts";go();
  }else{
    pendTview=n.type==="poll_new"||n.type==="poll_closed"?"vote":null;
    team=n.team_id?{id:n.team_id}:null;view="team";go();
  }
}
function initNotifs(){
  if(nCh&&nUser===user.id){loadNotifs();return;}
  stopNotifs();nUser=user.id;nSeen=null;loadNotifs();
  try{nCh=SB.channel("notif-"+user.id).on("postgres_changes",{event:"*",schema:"public",table:"notifications",filter:"user_id=eq."+user.id},()=>loadNotifs()).subscribe();}catch(e){}
}
function stopNotifs(){if(nCh&&SB){try{SB.removeChannel(nCh)}catch(e){}}nCh=null;nUser=null;nSeen=null;notifs=[];nErr=null;renderBell();}
$("bell").onclick=()=>{const p=$("npn");p.hidden=!p.hidden;if(!p.hidden){renderPanel();loadNotifs();}};
$("npn").onclick=e=>{
  const f=e.target.closest("[data-nf]");if(f){nf=f.dataset.nf;renderPanel();return;}
  const a=e.target.closest("[data-na]");if(a){a.dataset.na==="read"?markAll():clearAll();return;}
  const it=e.target.closest("[data-n]");if(it)openNotif(notifs.find(x=>x.id===it.dataset.n));
};
document.addEventListener("click",e=>{const p=$("npn");if(p&&!p.hidden&&!e.target.closest("#npn,#bell"))p.hidden=true;});
setInterval(()=>{if(user&&document.visibilityState==="visible")loadNotifs();},20000);

/* ---------- hồ sơ cá nhân ---------- */
// Lưu trong user_metadata của Supabase Auth: full_name, phone, address, avatar_url (ảnh nằm ở kho post-images/<user_id>/)
const AVB="post-images";
const meta=()=>(user&&user.user_metadata)||{};
const avUrl=()=>meta().avatar_url||"";
const avInner=(url,name)=>url?`<img src="${esc(url)}" alt="">`:ini(name);
function paintWho(){
  const w=$("who");if(!w)return;
  w.innerHTML=user?`<i class="av">${avInner(avUrl(),uname())}</i><span class="wn">${esc(uname())}</span>`:"";
}
function avPath(url){
  if(!url||!user)return null;const k="/"+AVB+"/",i=url.indexOf(k);if(i<0)return null;
  try{const p=decodeURIComponent(url.slice(i+k.length).split("?")[0]);return p.startsWith(user.id+"/")?p:null}catch(e){return null}
}
async function squareAvatar(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error("Không đọc được ảnh này."));i.src=url;});
    const s=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-s)/2,sy=(img.naturalHeight-s)/2,N=256;
    const c=document.createElement("canvas");c.width=c.height=N;const g=c.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,N,N);g.drawImage(img,sx,sy,s,s,0,0,N,N);
    return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("Không nén được ảnh.")),"image/jpeg",.85));
  }finally{URL.revokeObjectURL(url)}
}
let pfPend=null,pfRemove=false;
const pfSay=t=>{$("pferr").textContent=t||""};
function pfPaint(){
  const url=pfPend?pfPend.url:(pfRemove?"":avUrl());
  $("pfav").innerHTML=avInner(url,$("pfn").value.trim()||uname());
  $("pfrm").hidden=!url;
}
function pfClear(){if(pfPend){URL.revokeObjectURL(pfPend.url);pfPend=null}}
function openProfile(){
  if(!user)return;
  const m=meta();pfClear();pfRemove=false;pfSay("");
  $("pfn").value=uname();$("pfp").value=m.phone||"";$("pfe").value=user.email||"";$("pfa").value=m.address||"";
  $("pfh").textContent=user.new_email?"Đang chờ xác nhận đổi sang "+user.new_email+". Hãy mở hộp thư để xác nhận.":"Đổi email sẽ cần xác nhận qua thư gửi tới địa chỉ mới.";
  pfPaint();$("prf").hidden=false;$("pfn").focus();
}
function closeProfile(){pfClear();$("prf").hidden=true}
async function saveProfile(){
  const name=$("pfn").value.trim(),phone=$("pfp").value.trim(),email=$("pfe").value.trim(),addr=$("pfa").value.trim();
  if(!name)return pfSay("Hãy nhập tên hiển thị.");
  if(phone&&!/^\+?[0-9\s().-]{8,20}$/.test(phone))return pfSay("Số điện thoại chưa đúng định dạng.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return pfSay("Email chưa đúng định dạng.");
  const btn=$("pfs");btn.disabled=true;btn.textContent="Đang lưu…";pfSay("");
  let newPath=null;
  try{
    const old=avUrl();let url=old;
    if(pfPend){
      newPath=user.id+"/avatar_"+Date.now()+".jpg";
      const r=await SB.storage.from(AVB).upload(newPath,pfPend.blob,{contentType:"image/jpeg",cacheControl:"31536000"});
      if(r.error)throw new Error(/bucket|not found/i.test(r.error.message)?"Chưa tạo kho ảnh trên Supabase: hãy chạy đoạn SQL bài viết.":r.error.message);
      url=imgUrl(newPath);
    }else if(pfRemove)url="";
    const emailChanged=email.toLowerCase()!==(user.email||"").toLowerCase();
    const attrs={data:{full_name:name,phone,address:addr,avatar_url:url}};
    if(emailChanged)attrs.email=email;
    const r=await SB.auth.updateUser(attrs);
    if(r.error)throw r.error;
    if(r.data&&r.data.user)user=r.data.user;
    const op=avPath(old);if(op&&old!==url)SB.storage.from(AVB).remove([op]).then(()=>{},()=>{});
    paintWho();beat();
    const ca=document.querySelector(".composer .av");if(ca&&view==="posts")ca.innerHTML=avInner(avUrl(),uname());
    closeProfile();
    say(emailChanged?"✓ Đã lưu hồ sơ. Hãy mở email mới để xác nhận việc đổi email.":"✓ Đã lưu hồ sơ");
  }catch(e){
    if(newPath)SB.storage.from(AVB).remove([newPath]).then(()=>{},()=>{});
    pfSay("Lỗi: "+(e.message||e));
  }finally{btn.disabled=false;btn.textContent="Lưu hồ sơ"}
}
$("who").onclick=openProfile;
$("prfx").onclick=$("pfc").onclick=closeProfile;
$("prf").onclick=e=>{if(e.target.id==="prf")closeProfile()};
$("pfs").onclick=saveProfile;
$("pfn").oninput=()=>{if(!pfPend&&(pfRemove||!avUrl()))pfPaint()};
$("pfrm").onclick=()=>{pfClear();pfRemove=true;pfPaint()};
$("pffile").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  if(!/^image\//.test(f.type))return pfSay("Chỉ chọn được file ảnh.");
  if(f.size>15*1024*1024)return pfSay("Ảnh quá lớn (tối đa 15 MB).");
  try{const b=await squareAvatar(f);pfClear();pfPend={blob:b,url:URL.createObjectURL(b)};pfRemove=false;pfSay("");pfPaint();}
  catch(er){pfSay(er.message)}
};
$("prf").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing&&e.target.tagName==="INPUT"&&e.target.type!=="file"){e.preventDefault();saveProfile();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("prf").hidden)closeProfile()});

/* --- phân tích thời gian --- */
function openAnalytics(){view==="team"&&team?openTeamStats():openMyStats();}
function openMyStats(){const m=store(),ds=wkDates();let tot=0,best=null;const by={},perDay=[];
  ds.forEach((dt,i)=>{const f=fmt(dt);let b=0,run=0,rs=0;
    for(let h=0;h<=24;h++){const free=h<24&&!m.has(K(f,h));
      if(h<24&&!free){b++;const n=m.get(K(f,h))||"(chưa ghi chú)";by[n]=(by[n]||0)+1;}
      if(free){if(!run)rs=h;run++}else{if(run>0&&(!best||run>best.len))best={i,s:rs,e:h,len:run};run=0}}
    perDay.push(b);tot+=b;});
  const kinds=Object.entries(by).sort((a,b)=>b[1]-a[1]),focus=Object.entries(by).filter(([n])=>/^🎯/.test(n)).reduce((a,[,v])=>a+v,0),mxd=Math.max(1,...perDay),mxk=Math.max(1,...kinds.map(x=>x[1]));
  openGm("📊 Phân tích thời gian của tôi",`<div class="mut">Tuần ${dm(weekStart)} – ${dm(addD(weekStart,6))}</div>
   <div class="kpis"><div class="kpi"><b>${tot}h</b><small>Giờ bận (${Math.round(tot/168*100)}%)</small></div><div class="kpi"><b>${168-tot}h</b><small>Giờ rảnh</small></div><div class="kpi"><b>${focus}h</b><small>🎯 Focus Time</small></div></div>
   <b>Theo ngày</b><div class="stl">${ds.map((dt,i)=>`<span>${DAYS[i]} ${dm(dt)}</span>${hbar(perDay[i],mxd)}<b>${perDay[i]}h</b>`).join("")}</div>
   <b>Theo loại việc (ghi chú)</b><div class="stl">${kinds.length?kinds.map(([n,v])=>`<span>${esc(n)}</span>${hbar(v,mxk,"var(--free)")}<b>${v}h</b>`).join(""):"<span class='mut'>Chưa có giờ bận nào.</span>"}</div>
   ${best?`<div class="mut">🟢 Khoảng rảnh liên tục dài nhất: <b>${DAYS[best.i]} ${dm(ds[best.i])} · ${best.s}:00–${best.e}:00</b> (${best.len}h)</div>`:""}`);}
function openTeamStats(){const ds=wkDates(),tot=members.length;if(!tot)return;
  const cnt={};members.forEach(m=>cnt[m.user_id]=0);
  busy.filter(x=>x.user_id!==user.id).forEach(x=>{if(cnt[x.user_id]!=null)cnt[x.user_id]++});cnt[user.id]=tmine.size;
  let common=0;const perDay=ds.map(()=>0),hb=Array(24).fill(0);
  ds.forEach((dt,i)=>{const f=fmt(dt);for(let h=0;h<24;h++){const b=busyOf(K(f,h)).length;hb[h]+=b;if(!b){common++;perDay[i]++}}});
  const top=[...hb.keys()].filter(h=>hb[h]>0).sort((a,b)=>hb[b]-hb[a]).slice(0,3),bd=perDay.indexOf(Math.max(...perDay));
  const rows=members.map(m=>({n:m.name,b:cnt[m.user_id]||0})).sort((a,b)=>b.b-a.b),mx=Math.max(1,...rows.map(r=>r.b)),mxd=Math.max(1,...perDay);
  openGm("📊 Phân tích nhóm · "+team.name,`<div class="mut">Tuần ${dm(weekStart)} – ${dm(addD(weekStart,6))} · ${tot} thành viên</div>
   <div class="kpis"><div class="kpi"><b>${common}h</b><small>Giờ cả nhóm cùng rảnh</small></div><div class="kpi"><b>${Math.round(common/168*100)}%</b><small>Tỉ lệ trùng rảnh</small></div><div class="kpi"><b>${common?DAYS[bd]:"—"}</b><small>Ngày nhiều giờ rảnh nhất</small></div></div>
   <b>Giờ bận của từng thành viên</b><div class="stl">${rows.map(r=>`<span>${esc(r.n)}</span>${hbar(r.b,mx)}<b>${r.b}h</b>`).join("")}</div>
   <b>Giờ rảnh chung theo ngày</b><div class="stl">${ds.map((dt,i)=>`<span>${DAYS[i]} ${dm(dt)}</span>${hbar(perDay[i],mxd,"var(--free)")}<b>${perDay[i]}h</b>`).join("")}</div>
   ${top.length?`<div class="mut">⛔ Giờ nhiều người bận nhất: ${top.map(h=>"<b>"+h+":00</b>").join(", ")}</div>`:""}`);}

/* --- nhắc lịch (khi đang mở trang) --- */
let rem={on:false,lead:10},remSlots=[],remFired=new Set(),remTimer=null,remFetch=0;
try{Object.assign(rem,JSON.parse(localStorage.getItem("tsRem")||"{}"))}catch(e){}
const remSave=()=>{try{localStorage.setItem("tsRem",JSON.stringify(rem))}catch(e){}};
async function remLoad(){const t=new Date(),r=await SB.from("personal_slots").select("*").gte("slot_date",fmt(t)).lte("slot_date",fmt(addD(t,1)));if(!r.error)remSlots=r.data||[];remFetch=Date.now();}
function remBlocks(){const by=new Map(),out=[];remSlots.forEach(r=>by.set(r.slot_date+"|"+r.hour,r.note||""));
  [...new Set(remSlots.map(r=>r.slot_date))].forEach(d=>{let cur=null;for(let h=0;h<24;h++){const k=d+"|"+h;
    if(by.has(k)){const n=by.get(k);if(cur&&cur.note===n&&cur.e===h-1)cur.e=h;else{cur={d,s:h,e:h,note:n};out.push(cur)}}else cur=null}});return out;}
function remNotify(title,body){if("Notification" in window&&Notification.permission==="granted"){try{new Notification(title,{body})}catch(e){}}say(title+(body?" ("+body+")":""));}
async function remTick(){if(!rem.on||!user)return;if(Date.now()-remFetch>300000)await remLoad();const now=Date.now();
  remBlocks().forEach(b=>{const[y,mo,d]=b.d.split("-").map(Number),st=new Date(y,mo-1,d,b.s).getTime(),key=b.d+"|"+b.s;
    if(!remFired.has(key)&&now>=st-rem.lead*60000&&now<st){remFired.add(key);remNotify("⏰ "+(b.note||"Lịch bận")+" sau "+Math.max(1,Math.round((st-now)/60000))+" phút",b.s+":00–"+(b.e+1)+":00");}});}
function initRemind(){stopRemind();if(!rem.on)return;remLoad();remTimer=setInterval(remTick,30000);}
function stopRemind(){if(remTimer){clearInterval(remTimer);remTimer=null}remSlots=[];remFired=new Set();}

   <div class="mut" style="margin-top:10px">Quyền thông báo của trình duyệt: <b id="rpm">${perm==="granted"?"đã cho phép":perm==="denied"?"đã chặn (bật lại trong cài đặt trình duyệt)":perm==="unsupported"?"không hỗ trợ (chỉ hiện nhắc trong trang)":"chưa cấp"}</b></div>
   <div class="row" style="margin-top:12px"><button class="sp" id="rtest">Gửi thử thông báo</button></div>
   <hr><b>📲 Nhắc khi đã đóng trang (Web Push)</b><div id="xpush" class="mut" style="margin-top:6px">Đang kiểm tra…</div>`);
  $("ron").onchange=async e=>{rem.on=e.target.checked;remSave();
    if(rem.on){if("Notification" in window&&Notification.permission==="default"){try{await Notification.requestPermission()}catch(er){}}initRemind();say("✓ Đã bật nhắc lịch")}else{stopRemind();say("Đã tắt nhắc lịch")}};

  paintPush();

let cal={tid:null,ev:[],inv:[],rooms:[],bk:[],tk:[],err:null},roomSel=null,bkSel=new Set(),bkA=null,myTk=[],tkErr=null;
async function loadCal(){
  if(!team||!team.id)return;const[a,b]=wkRange(),tid=team.id;
  const[ev,rm,bk,tk]=await Promise.all([
    SB.from("team_events").select("*").eq("team_id",tid).gte("event_date",a).lte("event_date",b).order("event_date").order("start_hour"),
    SB.from("rooms").select("*").eq("team_id",tid).order("name"),
    SB.from("bookings").select("*").eq("team_id",tid).gte("booking_date",a).lte("booking_date",b).order("booking_date").order("start_hour"),
    SB.from("tasks").select("*").eq("team_id",tid).order("due_date",{ascending:true,nullsFirst:false}).limit(300)]);
  const er=ev.error||rm.error||bk.error||tk.error;
  if(!team||team.id!==tid)return;
  if(er){cal={tid,ev:[],inv:[],rooms:[],bk:[],tk:[],err:er.message};return;}

  if(ids.length){const iv=await SB.from("event_invites").select("*").in("event_id",ids);if(!iv.error)inv=iv.data||[];}

  openGm("📅 "+e.title,`<div class="xdet"><div class="mut">${dowOf(e.event_date)} ${dm(parse(e.event_date))}/${parse(e.event_date).getFullYear()} · ${e.start_hour}:00–${e.end_hour}:00${room?" · 🏢 "+esc(room.name):""}${e.location?" · 📍 "+esc(e.location):""}</div>

   <div class="row" style="margin-top:12px"><button id="xics">⬇ Xuất .ics</button></div></div>`);

function evIcs(e){
  const d=parse(e.event_date),z=new Date().toISOString().replace(/[-:]|\.\d{3}/g,""),end=e.end_hour>=24?stamp(addD(d,1),0):stamp(d,e.end_hour);

/* ---------- bình chọn nâng cao: hạn chót · ẩn danh · giới hạn phiếu ---------- */
const pExpired=p=>!!p.closes_at&&new Date(p.closes_at)<=new Date();
const pClosed=p=>!!p.closed||pExpired(p);
const pCnt=(p,o)=>p.anonymous&&p.tally?(p.tally[o.id]||0):(p.poll_votes||[]).filter(v=>v.option_id===o.id).length;
const pVoters=p=>p.anonymous&&p.tally?(p.voters_n||0):new Set((p.poll_votes||[]).map(v=>v.user_id)).size;
const pTotal=p=>(p.poll_options||[]).reduce((a,o)=>a+pCnt(p,o),0);
async function fetchPolls(){
  const r=await SB.from("polls").select("*,poll_options(id,label,position),poll_votes(option_id,user_id)").eq("team_id",team.id).order("created_at",{ascending:false});
  if(r.error){pollErr=r.error.message;polls=[];return false;}polls=r.data||[];return true;}
async function loadPolls(){polls=[];pollErr=null;if(!team)return;
  if(!await fetchPolls())return;
  if(polls.some(p=>!p.closed&&pExpired(p))){const s=await SB.rpc("sweep_team_polls",{p_team:team.id});if(!s.error)await fetchPolls();}
  if(polls.some(p=>p.anonymous)){const t=await SB.rpc("poll_tally",{p_team:team.id});
    if(!t.error){const by={};(t.data||[]).forEach(x=>{(by[x.poll_id]=by[x.poll_id]||{tally:{},voters:0}).tally[x.option_id]=x.votes;by[x.poll_id].voters=x.voters;});
      polls.forEach(p=>{if(p.anonymous){const z=by[p.id]||{tally:{},voters:0};p.tally=z.tally;p.voters_n=z.voters;}});}}}
function pollCard(p){
  const opts=[...(p.poll_options||[])].sort((a,b)=>a.position-b.position),votes=p.poll_votes||[],total=pTotal(p),voters=pVoters(p),cl=pClosed(p),anon=!!p.anonymous;
  const myV=new Set(votes.filter(v=>v.user_id===user.id).map(v=>v.option_id)),max=Math.max(0,...opts.map(o=>pCnt(p,o)));
  const nm=id=>(members.find(m=>m.user_id===id)||{}).name||"?";
  const info=[esc(p.created_by_name||""),p.multi?"chọn nhiều"+(p.max_votes?" (tối đa "+p.max_votes+")":""):"chọn một",voters+"/"+members.length+" người đã vote"];
  if(anon)info.push("🙈 ẩn danh");if(p.closes_at)info.push((cl?"đã hết hạn ":"hạn ")+dt(p.closes_at));
  return `<div class="pcard ${cl?"closed":""}" data-p="${p.id}"><div class="row"><h3 class="sp">${esc(p.title)}</h3><span class="tag ${cl?"":"open"}">${cl?"Đã đóng":"Đang mở"}</span></div>
  <div class="pmeta">${info.join(" · ")}</div>
  ${opts.map(o=>{const c=pCnt(p,o),pc=total?Math.round(c/total*100):0,names=anon?[]:votes.filter(v=>v.option_id===o.id).map(v=>nm(v.user_id));
   return `<button class="popt ${myV.has(o.id)?"on":""} ${c&&c===max?"lead":""}" data-o="${o.id}"><span class="fill" style="width:${pc}%"></span><span class="in2"><span>${myV.has(o.id)?"✓ ":""}${esc(o.label)}</span><span class="cnt">${c} phiếu · ${pc}%</span></span></button>${names.length?`<div class="pvoters" title="${esc(names.join(", "))}">${esc(names.slice(0,4).join(", "))}${names.length>4?" +"+(names.length-4):""}</div>`:""}`}).join("")}
  ${p.created_by===user.id?`<div class="row"><button class="pa" data-a="close">${cl?"Mở lại":"Đóng bình chọn"}</button><button class="pa" data-a="del">Xóa</button></div>`:""}</div>`;}
function votePane(){
  const open=polls.filter(x=>!pClosed(x));
  const body=pollErr?`<div class="mut" style="padding:8px">⚠️ Chưa tải được bình chọn: ${esc(pollErr)}.<br>Hãy chạy file <b>setup_vote.sql</b> trong Supabase → SQL Editor để tạo bảng bình chọn.</div>`
   :!open.length?`<div class="mut" style="padding:8px">Chưa có bình chọn nào đang mở. ${canEditTeam()?"Bấm “＋ Tạo bình chọn” ở cột trái để bắt đầu.":""}${polls.length?" Các bình chọn đã đóng nằm ở thẻ <b>Lịch sử vote</b> bên phải.":""}</div>`
   :`<div class="polls" id="pl">${open.map(pollCard).join("")}</div>`;
  return `<div class="ptop"><h2 style="margin:0;font-size:17px">🗳️ Bình chọn của nhóm</h2><span class="sp"></span><span class="mut">${open.length} đang mở</span></div>${body}`;}
async function castVote(pid,oid){
  const p=polls.find(x=>x.id===pid);if(!p)return;if(pClosed(p))return say("Bình chọn này đã đóng hoặc hết hạn.");
  const mv=(p.poll_votes||[]).filter(v=>v.user_id===user.id).map(v=>v.option_id);let r;
  if(mv.includes(oid))r=await SB.from("poll_votes").delete().eq("option_id",oid).eq("user_id",user.id);
  else{
    if(p.multi&&p.max_votes&&mv.length>=p.max_votes)return say("Chỉ được chọn tối đa "+p.max_votes+" phương án. Hãy bỏ một lựa chọn trước.");
    if(!p.multi&&mv.length){r=await SB.from("poll_votes").delete().eq("poll_id",pid).eq("user_id",user.id);if(r.error)return say("Lỗi: "+r.error.message);}
    r=await SB.from("poll_votes").insert({poll_id:pid,option_id:oid,user_id:user.id});}
  if(r.error)return say("Lỗi: "+dbErr(r.error));await loadTeam(false);}
async function pollAction(pid,a){

    r=await SB.from("polls").update(cl?{closed:false,closes_at:null}:{closed:true}).eq("id",pid);
    msg=cl?"✓ Đã mở lại bình chọn (bỏ hạn chót)":"✓ Đã đóng. Bình chọn được lưu vào Lịch sử vote";}
  else{if(!confirm("Xóa bình chọn này?"))return false;r=await SB.from("polls").delete().eq("id",pid);msg="✓ Đã xóa bình chọn";}
  if(r.error){say("Lỗi: "+dbErr(r.error));return false;}
  await loadTeam(false);say(msg);return true;}
function resultOf(p){const opts=p.poll_options||[];if(!pTotal(p))return "Chưa có phiếu nào";
  const max=Math.max(...opts.map(o=>pCnt(p,o))),top=opts.filter(o=>pCnt(p,o)===max);
  return (top.length>1?"Hòa: ":"🏆 ")+top.map(o=>o.label).join(", ")+" ("+max+" phiếu)";}
function historyCard(){
  const cl=polls.filter(pClosed);
  return `<aside class="card side notes"><h2>🕘 Lịch sử vote</h2><div class="nl" id="hl">${
   pollErr?"<span class='mut'>Chưa tải được dữ liệu bình chọn.</span>"
   :cl.length?cl.map(p=>{const vt=pVoters(p),end=p.closed_at||p.closes_at;
     return `<div class="ni hi" data-h="${p.id}"><div class="nt"><b>${esc(p.title)}</b>${p.anonymous?" <span class='tag'>🙈 ẩn danh</span>":""}<div class="mut">${esc(p.created_by_name||"")} · ${vt} người vote</div><div class="mut">Tạo: ${dt(p.created_at)}</div><div class="mut">Đóng: ${end?dt(end):"không rõ"}</div><div class="res">${esc(resultOf(p))}</div></div><button class="pa" data-h="${p.id}">Xem lại</button></div>`}).join("")
   :"<span class='mut'>Chưa có bình chọn nào được đóng. Khi đóng, bình chọn sẽ được lưu ở đây để xem lại.</span>"}</div></aside>`;}
function reviewHtml(p){
  const opts=[...(p.poll_options||[])].sort((a,b)=>a.position-b.position),votes=p.poll_votes||[],total=pTotal(p),voted=new Set(votes.map(v=>v.user_id)),anon=!!p.anonymous,cl=pClosed(p),end=p.closed_at||p.closes_at;
  const nm=id=>(members.find(m=>m.user_id===id)||{}).name||"(đã rời nhóm)",not=anon?[]:members.filter(m=>!voted.has(m.user_id)).map(m=>m.name);

   ${opts.map(o=>{const c=pCnt(p,o),pc=total?Math.round(c/total*100):0,vs=votes.filter(v=>v.option_id===o.id);
     return `<div class="popt"><span class="fill" style="width:${pc}%"></span><span class="in2"><span>${esc(o.label)}</span><span class="cnt">${c} phiếu · ${pc}%</span></span></div>${anon?"":`<div class="pvoters">${c?"Đã chọn: "+vs.map(v=>esc(nm(v.user_id))).join(", "):"Chưa có ai chọn"}</div>`}`}).join("")}
   ${anon?`<div class="pmeta" style="margin-top:6px">Bình chọn ẩn danh: hệ thống không lưu lộ ai đã chọn phương án nào.</div>`:""}

   ${p.created_by===user.id?`<div class="row" style="margin-top:14px"><button class="pa" data-a="close">${cl?"Mở lại bình chọn":"Đóng bình chọn"}</button><button class="pa" data-a="del">Xóa</button></div>`:""}`;}
function openPollForm(){if(!canEditTeam())return say("Vai trò Chỉ xem không tạo được bình chọn.");
  $("pt").value="";$("po").innerHTML="";addOpt("");addOpt("");$("pmu").checked=false;$("pdl").value="";$("pan").checked=false;$("pmx").value="";$("pmxr").hidden=true;$("pcm").hidden=false;$("pt").focus();}
async function submitPoll(){
  const title=$("pt").value.trim(),opts=[...new Set([...document.querySelectorAll("#po .po")].map(i=>i.value.trim()).filter(Boolean))];
  if(!title)return say("Hãy nhập tiêu đề bình chọn.");if(opts.length<2)return say("Cần ít nhất 2 phương án khác nhau.");
  const row={team_id:team.id,title,multi:$("pmu").checked,created_by:user.id,created_by_name:uname()};
  if($("pdl").value){const d=new Date($("pdl").value);if(isNaN(d))return say("Hạn chót không hợp lệ.");if(d<=new Date())return say("Hạn chót phải ở tương lai.");row.closes_at=d.toISOString();}
  if($("pan").checked)row.anonymous=true;
  const mx=parseInt($("pmx").value,10);if($("pmu").checked&&mx>0){if(mx>=opts.length)say("Giới hạn phiếu lớn hơn hoặc bằng số phương án nên sẽ không có tác dụng.");row.max_votes=mx;}
  $("pgo").disabled=true;
  const r=await SB.from("polls").insert(row).select().single();
  if(r.error){$("pgo").disabled=false;return say("Lỗi: "+dbErr(r.error));}
  const r2=await SB.from("poll_options").insert(opts.map((label,i)=>({poll_id:r.data.id,label,position:i})));
  $("pgo").disabled=false;
  if(r2.error){await SB.from("polls").delete().eq("id",r.data.id);return say("Lỗi: "+r2.error.message);}
  $("pcm").hidden=true;say("✓ Đã tạo bình chọn");await loadTeam(false);}
async function autoClosePolls(){
  const L=polls.filter(p=>!pClosed(p)&&p.created_by===user.id&&members.length>1&&pVoters(p)>=members.length);
  for(const p of L){const r=await SB.from("polls").update({closed:true}).eq("id",p.id);if(r.error)continue;p.closed=true;
    const opts=p.poll_options||[],mx=Math.max(0,...opts.map(o=>pCnt(p,o))),win=opts.filter(o=>pCnt(p,o)===mx&&mx>0);
    const t="🗳️ Bình chọn “"+p.title+"” đã tự động chốt vì cả nhóm đã bỏ phiếu. Kết quả: "+(win.length?win.map(o=>o.label).join(" / ")+" ("+mx+" phiếu)":"chưa có phương án nào được chọn");
    const m=await SB.from("team_messages").insert({team_id:team.id,user_id:user.id,user_name:uname(),content:t.slice(0,500)}).select().single();
    if(!m.error&&!chatMsgs.find(x=>x.id===m.data.id))chatMsgs.push(m.data);
    say("✓ Bình chọn “"+p.title+"” đã tự động chốt");}}

     <div class="row"><button class="pa" data-lc="${l.token}">📋 Sao chép</button>${on?`<a class="btn" style="padding:4px 10px;font-size:12px" target="_blank" rel="noopener" href="${esc(liveUrl(l.token))}">Mở thử</a>`:""}<button class="pa" data-lr="${l.token}" data-v="${l.revoked?0:1}">${l.revoked?"Kích hoạt lại":"Thu hồi"}</button><button class="pa dg" data-ld="${l.token}">Xóa</button></div></div>`}).join(""):"<div class='mut' style='margin:10px 0'>Chưa có liên kết nào.</div>"}

    if(!data||!data.ok){$("app").innerHTML=`<div class="card"><h2>🔗 Liên kết không còn hiệu lực</h2><p class="mut">Liên kết này đã bị thu hồi, đã hết hạn hoặc không tồn tại. Hãy nhờ người chia sẻ gửi liên kết mới.</p><a class="btn" href="${esc(location.pathname)}">Mở Timesheet</a></div>`;return;}
    const team_=data.scope==="team",tot=data.total||0,m=new Map();(data.slots||[]).forEach(s=>m.set(K(s.d,s.h),team_?s.b:(s.n||"")));
    ctx={cell:k=>{
      if(team_){const b=m.get(k)||0;return b?{cls:"part",txt:(tot-b)+"/"+tot,tip:b+" người bận"}:{cls:"free",txt:"✓ "+tot+"/"+tot};}
      return m.has(k)?{cls:"busy"+(m.get(k)?" n"+hue(m.get(k)):""),txt:data.notes?m.get(k):"",tip:data.notes?m.get(k):""}:{cls:""};}};
    const legend_=team_?`<div class="legend"><span><i style="background:var(--free)"></i>Tất cả cùng rảnh</span><span><i style="background:var(--head);border:1px solid var(--bd)"></i>Có người bận (số = người rảnh/tổng)</span></div>`:`<div class="legend"><span><i style="background:var(--ac)"></i>Giờ bận</span><span><i style="background:var(--head);border:1px solid var(--bd)"></i>Giờ rảnh</span></div>`;
    $("app").innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">🔗 ${team_?"Lịch nhóm":"Lịch của"} ${esc(data.name||"bạn bè")}</h2><span class="sp"></span><a class="btn" href="${esc(location.pathname)}">Mở Timesheet</a></div>
     <p class="mut" style="margin:6px 0 10px">Chỉ xem · tự cập nhật theo lịch mới nhất của người chia sẻ.</p><div class="ptop">${nav()}<span class="sp"></span>${legend_}</div>${grid(k=>ctx.cell(k))}</div>`;
    $("lpw").onclick=()=>{weekStart=addD(weekStart,-7);load()};$("lnw").onclick=()=>{weekStart=addD(weekStart,7);load()};$("ltd").onclick=()=>{weekStart=mondayOf(new Date());load()};};
  const load=async()=>{const[a,b]=wkRange();const r=await LS.rpc("get_shared_calendar",{p_token:tok,p_from:a,p_to:b});
    if(r.error){err=r.error.message;data=null;}else{err=null;data=r.data;}first=false;draw();};
  draw();await load();
  setInterval(()=>{if(document.visibilityState==="visible"&&data&&data.ok)load();},30000);}

/* ---------- thông báo đẩy khi đã đóng trang (web push) ---------- */
// Khóa công khai VAPID (tạo bằng: npx web-push generate-vapid-keys). Xem HUONG-DAN-V3.md
const VAPID_PUBLIC_KEY="BAYiNYal3u0PyKDesIH5q9QCzD0XkoRrw2DxvlqRf7_XY-G_fsdbrMoWBe2crBWrf2itAERshAtdxoFbV00bXvA";
const pushOk=()=>("serviceWorker" in navigator)&&("PushManager" in window)&&("Notification" in window);
const b64u=s=>{const p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)));};
async function pushSub(){try{const reg=await navigator.serviceWorker.getRegistration();return reg?await reg.pushManager.getSubscription():null;}catch(e){return null;}}
async function paintPush(){
  const el=$("xpush");if(!el)return;
  if(!pushOk()){el.innerHTML="<div class='mut'>Trình duyệt này không hỗ trợ thông báo đẩy. Trên iPhone/iPad: thêm Timesheet vào Màn hình chính rồi mở từ biểu tượng đó.</div>";return;}
  if(!window.isSecureContext){el.innerHTML="<div class='mut'>Thông báo đẩy chỉ hoạt động trên trang HTTPS.</div>";return;}
  const[sub,q]=await Promise.all([pushSub(),SB.from("push_prefs").select("*").maybeSingle()]);if(!$("xpush"))return;
  if(q.error){el.innerHTML=`<div class="mut">⚠️ ${esc(dbErr(q.error))}</div>`;return;}
  const pr=q.data||{lead_min:10,notify_events:true,notify_tasks:true,notify_slots:true},on=!!sub&&!!q.data&&q.data.enabled;
  el.className="";
  el.innerHTML=`<div class="pushbox"><div class="mut">Trạng thái: <b>${on?"đang bật trên thiết bị này":"chưa bật"}</b>${Notification.permission==="denied"?" · trình duyệt đang chặn thông báo (bật lại trong cài đặt trang web)":""}. Hệ thống nền gửi nhắc ngay cả khi bạn đã đóng trang.</div>
   <label class="row"><input type="checkbox" id="xpe" ${pr.notify_events?"checked":""}> Sự kiện nhóm đã mời tôi (trừ sự kiện đã từ chối)</label>
   <label class="row"><input type="checkbox" id="xpt" ${pr.notify_tasks?"checked":""}> Công việc đến hạn (không có giờ = 08:00)</label>
   <label class="row"><input type="checkbox" id="xps" ${pr.notify_slots?"checked":""}> Giờ bận trong lịch cá nhân</label>
   <div class="row"><span>Nhắc trước</span><select id="xpl" class="xs">${[5,10,15,30,60,120].map(n=>`<option value="${n}" ${n===pr.lead_min?"selected":""}>${n} phút</option>`).join("")}</select></div>
   <div class="row"><button class="p sp" id="xpon" type="button">${on?"Cập nhật":"Bật thông báo nền"}</button>${on?`<button id="xpoff" type="button">Tắt</button><button id="xptest" type="button">Gửi thử</button>`:""}</div></div>`;
  $("xpon").onclick=pushEnable;const o=$("xpoff");if(o)o.onclick=pushDisable;const t=$("xptest");if(t)t.onclick=pushTest;}
async function pushEnable(){
  if(VAPID_PUBLIC_KEY.startsWith("DAN_"))return say("Chưa cấu hình khóa VAPID trong index.html. Xem HUONG-DAN-V3.md.");
  const btn=$("xpon");btn.disabled=true;
  try{
    const perm=Notification.permission==="granted"?"granted":await Notification.requestPermission();
    if(perm!=="granted")throw new Error("Bạn chưa cấp quyền thông báo cho trình duyệt.");
    const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC_KEY)});
    const j=sub.toJSON();
    let r=await SB.rpc("register_push",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});if(r.error)throw r.error;
    r=await SB.from("push_prefs").upsert({user_id:user.id,enabled:true,lead_min:+$("xpl").value,tz_offset_min:-new Date().getTimezoneOffset(),notify_events:$("xpe").checked,notify_tasks:$("xpt").checked,notify_slots:$("xps").checked},{onConflict:"user_id"});
    if(r.error)throw r.error;
    say("✓ Đã bật thông báo nền cho thiết bị này");
  }catch(e){say("Lỗi: "+dbErr(e));}
  paintPush();}
async function pushDisable(){
  try{const sub=await pushSub();
    if(sub){await SB.from("push_subs").delete().eq("endpoint",sub.endpoint);await sub.unsubscribe();}
    const r=await SB.from("push_prefs").update({enabled:false}).eq("user_id",user.id);if(r.error)throw r.error;
    say("Đã tắt thông báo nền trên thiết bị này");
  }catch(e){say("Lỗi: "+dbErr(e));}
  paintPush();}
async function pushTest(){
  try{const reg=await navigator.serviceWorker.getRegistration();if(!reg)throw new Error("Chưa đăng ký service worker.");
    await reg.showNotification("⏰ Thông báo thử",{body:"Thiết bị này nhận được thông báo của Timesheet."});}
  catch(e){say("Lỗi: "+(e.message||e));}}
if("serviceWorker" in navigator)navigator.serviceWorker.addEventListener("message",e=>{
  if(e.data&&e.data.type==="push")say("🔔 "+e.data.title+(e.data.body?" · "+e.data.body:""));});

/* ===================================================================
   Cột "Trò chuyện" ở trang Bài viết: danh sách người dùng + đang hoạt động,
   chat riêng 1-1 và chat nhóm. Cần chạy migrate_v4.sql.
   =================================================================== */
const ONLINE_MS=150000;
let ppl={users:[],teams:[],unread:{},q:"",chat:null,msgs:[],err:null,loaded:false};
const pOnline=u=>!!u.last_seen&&Date.now()-new Date(u.last_seen).getTime()<ONLINE_MS;
const peopleCard=()=>`<aside class="card side people" id="ppl"></aside>`;
async function beat(){if(!user||!SB)return;try{await SB.from("profiles").upsert({user_id:user.id,name:uname(),avatar_url:avUrl()||null,last_seen:new Date().toISOString()},{onConflict:"user_id"});}catch(e){}}
function paintBadge(){const n=Object.values(ppl.unread).reduce((a,b)=>a+b,0),tp=$("tp");if(tp)tp.innerHTML="📰 Bài viết"+(n?` <i class="ubadge">${n>9?"9+":n}</i>`:"");}
async function pollUnread(){if(!user||!SB)return;
  const r=await SB.from("direct_messages").select("sender").eq("recipient",user.id).is("read_at",null).limit(500);if(r.error)return;
  const u={};(r.data||[]).forEach(x=>u[x.sender]=(u[x.sender]||0)+1);ppl.unread=u;paintBadge();
  if(view==="posts"&&!ppl.chat)renderPList();}
setInterval(()=>{if(user&&document.visibilityState==="visible")beat();},60000);
setInterval(()=>{if(user)pollUnread();},20000);
setInterval(()=>{if(user&&view==="posts"&&ppl.chat)pollChatP();},3000);
setInterval(()=>{if(user&&view==="posts"&&!ppl.chat&&document.visibilityState==="visible")loadPeople();},20000);
document.addEventListener("visibilitychange",()=>{if(user&&document.visibilityState==="visible")beat();});

function initPeople(){ppl.chat=null;paintPeople();loadPeople();pollUnread();}
async function loadPeople(){
  const[u,t]=await Promise.all([SB.from("profiles").select("user_id,name,avatar_url,last_seen").order("name").limit(500),SB.from("teams").select("id,name").order("created_at")]);
  ppl.err=u.error?u.error.message:null;ppl.users=(u.data||[]).filter(x=>x.user_id!==user.id);ppl.teams=t.data||[];ppl.loaded=true;
  if(view==="posts"&&$("ppl")&&!ppl.chat)renderPList();}
function paintPeople(){const el=$("ppl");if(!el)return;ppl.chat?paintChat(el):paintList(el);}
function paintList(el){
  el.innerHTML=`<div class="row"><h2 style="margin:0">💬 Trò chuyện</h2><span class="sp"></span><span class="mut" id="pon"></span></div>
   <input id="pq" placeholder="Tìm người dùng hoặc nhóm…" value="${esc(ppl.q)}" autocomplete="off"><div class="plist" id="pll"></div>`;
  $("pq").oninput=e=>{ppl.q=e.target.value;renderPList();};
  $("pll").onclick=ev=>{
    const u=ev.target.closest("[data-u]");if(u){const x=ppl.users.find(z=>z.user_id===u.dataset.u);if(x)openChat({kind:"dm",id:x.user_id,name:x.name,avatar:x.avatar_url,online:pOnline(x)});return;}
    const g=ev.target.closest("[data-g]");if(g){const x=ppl.teams.find(z=>z.id===g.dataset.g);if(x)openChat({kind:"team",id:x.id,name:x.name});}};
  renderPList();}
function renderPList(){const el=$("pll");if(!el)return;
  if(ppl.err){el.innerHTML=`<div class="mut" style="padding:8px">⚠️ ${esc(dbErr({message:ppl.err}))}<br>Hãy chạy file <b>migrate_v4.sql</b> trong Supabase → SQL Editor.</div>`;return;}
  if(!ppl.loaded){el.innerHTML="<div class='mut' style='padding:8px'>Đang tải…</div>";return;}
  const q=ppl.q.trim().toLowerCase(),f=n=>!q||(n||"").toLowerCase().includes(q);
  const us=ppl.users.filter(u=>f(u.name)),on=us.filter(pOnline),off=us.filter(u=>!pOnline(u)),ts=ppl.teams.filter(t=>f(t.name));
  const badge=n=>n?`<i class="ubadge">${n>9?"9+":n}</i>`:"";
  const row=u=>`<div class="prow" data-u="${u.user_id}"><span class="pw"><i class="av">${avInner(u.avatar_url,u.name)}</i><i class="odot ${pOnline(u)?"on":""}"></i></span><span class="mn">${esc(u.name||"Người dùng")}</span>${badge(ppl.unread[u.user_id])}</div>`;
  const nOn=ppl.users.filter(pOnline).length;if($("pon"))$("pon").textContent="🟢 "+nOn+" đang hoạt động";
  el.innerHTML=(ts.length?`<div class="psec">Nhóm của tôi</div>`+ts.map(t=>`<div class="prow" data-g="${t.id}"><span class="pw"><i class="av">👥</i></span><span class="mn">${esc(t.name)}</span><small class="mut">chat nhóm</small></div>`).join(""):"")
   +`<div class="psec">Đang hoạt động (${on.length})</div>`+(on.length?on.map(row).join(""):"<div class='mut' style='padding:4px 8px'>Chưa có ai đang hoạt động.</div>")
   +`<div class="psec">Ngoại tuyến (${off.length})</div>`+(off.length?off.slice(0,150).map(row).join(""):"<div class='mut' style='padding:4px 8px'>—</div>");}
function paintChat(el){const c=ppl.chat;
  el.innerHTML=`<div class="row" style="flex-wrap:nowrap"><button class="pa" id="pback" type="button" title="Quay lại danh sách">←</button>
   <span class="pw">${c.kind==="dm"?`<i class="av">${avInner(c.avatar,c.name)}</i><i class="odot ${c.online?"on":""}"></i>`:`<i class="av">👥</i>`}</span>
   <div class="sp" style="min-width:0"><b class="mn" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name||"Người dùng")}</b><span class="mut" style="font-size:12px">${c.kind==="team"?"Chat nhóm · mọi thành viên cùng thấy":c.online?"🟢 Đang hoạt động":"Ngoại tuyến"}</span></div></div>
   <div class="cl" id="pcl"></div><div class="row cin"><input id="pci" class="sp" maxlength="500" placeholder="Nhập tin nhắn…" autocomplete="off"><button class="p" id="pcs" type="button">Gửi</button></div>`;
  $("pback").onclick=()=>{ppl.chat=null;paintPeople();loadPeople();};
  $("pcs").onclick=sendP;$("pci").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();sendP();}};}
async function fetchChat(since){
  const c=ppl.chat,me=user.id;let q;
  if(c.kind==="dm")q=SB.from("direct_messages").select("*").or("and(sender.eq."+me+",recipient.eq."+c.id+"),and(sender.eq."+c.id+",recipient.eq."+me+")");
  else q=SB.from("team_messages").select("*").eq("team_id",c.id);
  q=since?q.gte("created_at",since).order("created_at",{ascending:true}):q.order("created_at",{ascending:false});
  const r=await q.limit(200);if(r.error){ppl.err=r.error.message;return null;}
  const rows=since?(r.data||[]):(r.data||[]).slice().reverse();
  return rows.map(m=>c.kind==="dm"?{id:m.id,uid:m.sender,name:m.sender_name,content:m.content,at:m.created_at}:{id:m.id,uid:m.user_id,name:m.user_name,content:m.content,at:m.created_at});}
async function openChat(c){
  ppl.chat=c;ppl.msgs=[];ppl.err=null;paintPeople();$("pcl").innerHTML="<div class='mut' style='padding:8px'>Đang tải…</div>";
  const rows=await fetchChat();if(ppl.chat!==c)return;
  if(rows===null){$("pcl").innerHTML=`<div class="mut" style="padding:8px">⚠️ ${esc(dbErr({message:ppl.err}))}</div>`;return;}
  ppl.msgs=rows;renderMsgs(true);if(c.kind==="dm")markRead();if($("pci"))$("pci").focus();}
async function markRead(){const c=ppl.chat;if(!c||c.kind!=="dm")return;
  delete ppl.unread[c.id];paintBadge();
  await SB.from("direct_messages").update({read_at:new Date().toISOString()}).eq("recipient",user.id).eq("sender",c.id).is("read_at",null);}
async function pollChatP(){
  const c=ppl.chat;if(!c)return;const last=ppl.msgs.length?ppl.msgs[ppl.msgs.length-1].at:null;
  const rows=await fetchChat(last);if(!rows||ppl.chat!==c)return;
  const seen=new Set(ppl.msgs.map(m=>m.id)),add=rows.filter(m=>!seen.has(m.id));if(!add.length)return;
  ppl.msgs=ppl.msgs.concat(add).slice(-300);renderMsgs();
  if(c.kind==="dm"&&add.some(m=>m.uid!==user.id))markRead();}
function renderMsgs(stick){const el=$("pcl");if(!el)return;const c=ppl.chat,near=el.scrollHeight-el.scrollTop-el.clientHeight<60;
  let day="",h="";
  ppl.msgs.forEach(m=>{const d=new Date(m.at),dl=dayLabel(d),mine=m.uid===user.id;
    if(dl!==day){day=dl;h+=`<div class="cday">${esc(dl)}</div>`;}
    h+=`<div class="cm ${mine?"me":""}"><div class="ch">${c.kind==="team"?`<b>${m.uid===(ppl.teams.find(t=>t.id===c.id)||{}).owner?"👑 ":""}${mine?"Bạn":esc(m.name)}</b> · `:""}<span title="${dmy(d)} ${hm(d)}">${hm(d)}</span></div><div class="cb">${esc(m.content)}</div></div>`;});
  el.innerHTML=h||"<div class='mut' style='text-align:center;padding:12px'>Chưa có tin nhắn nào. Hãy gửi lời chào 👋</div>";
  if(stick===true||near)el.scrollTop=el.scrollHeight;}
async function sendP(){
  const c=ppl.chat,i=$("pci");if(!c||!i)return;const t=i.value.trim();if(!t)return;i.value="";
  const r=c.kind==="dm"?await SB.from("direct_messages").insert({sender:user.id,recipient:c.id,sender_name:uname(),content:t}).select().single()
    :await SB.from("team_messages").insert({team_id:c.id,user_id:user.id,user_name:uname(),content:t}).select().single();
  if(r.error){i.value=t;return say("Lỗi gửi tin: "+dbErr(r.error));}
  const m=r.data;if(ppl.chat===c&&!ppl.msgs.find(x=>x.id===m.id)){ppl.msgs.push(c.kind==="dm"?{id:m.id,uid:m.sender,name:m.sender_name,content:m.content,at:m.created_at}:{id:m.id,uid:m.user_id,name:m.user_name,content:m.content,at:m.created_at});renderMsgs(true);}
  if($("pci"))$("pci").focus();}

function start(){
  try{
    if(/^#share=/.test(location.hash)){shareView();return;}
    if(SUPABASE_URL==="DAN_PROJECT_URL"||SUPABASE_KEY==="DAN_ANON_PUBLIC_KEY"){$("app").innerHTML="<div class='card'>Chưa cấu hình Supabase. Mở file index.html và dán Project URL + anon key.</div>";return;}
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SUPABASE_URL.trim())){$("app").innerHTML="<div class='card'>Project URL chưa đúng. Phải có dạng https://xxxxxxxx.supabase.co (không thêm /rest/v1 hay dấu cách).</div>";return;}
    if(/^#live=/.test(location.hash)){liveStart();return;}
    SB=supabase.createClient(SUPABASE_URL.trim(),SUPABASE_KEY.trim());
    $("out").onclick=()=>SB.auth.signOut();
    SB.auth.onAuthStateChange((ev,session)=>{
      try{
        user=session?session.user:null;
        $("out").hidden=!user;$("bell").hidden=!user;paintWho();
        if(!user){team=null;stopNotifs();stopRemind();authView();return;}
        if(ev==="SIGNED_IN"||ev==="INITIAL_SESSION"){shell();go();initNotifs();initRemind();beat();pollUnread();}
      }catch(e){showErr(e)}
    });
    setInterval(()=>{const a=document.activeElement;if(user&&view==="team"&&team&&drag===null&&!dirty&&!(a&&["ci","nt"].includes(a.id)&&a.value))loadTeam(false);},15000);
    setInterval(()=>{if(user&&view==="team"&&team)pollChat();},3000);
  }catch(e){showErr(e)}
}
function showErr(e){$("app").innerHTML="<div class='card'><b>Lỗi khởi động:</b> "+esc(e&&e.message||e)+"</div>";}
window.addEventListener("error",e=>{if(!$("app").innerHTML)showErr(e.message)});
if(window.supabase)start();
else{const sc=document.createElement("script");sc.src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
  sc.onload=start;sc.onerror=()=>{$("app").innerHTML="<div class='card'>Không tải được thư viện Supabase. Kiểm tra mạng hoặc tắt trình chặn quảng cáo rồi tải lại.</div>"};
  document.head.appendChild(sc);}
